<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>솔라의 프롬 · Archive</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="moon"></div>
      <div class="title-block">
        <h1>용뜬,</h1>
        <p id="rangeLabel">솔라의 프롬 아카이브</p>
      </div>
      <div class="count-badge" id="countBadge">0</div>
    </div>
    <nav class="months" id="months" aria-label="월 선택"></nav>
  </header>

  <main class="chat" id="chat">
    <div class="chat-inner" id="chatInner"></div>
  </main>

  <button class="jump" id="jumpBtn" title="최신 메시지로">
    <svg viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
