<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Solar · Schedule Archive</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
<script async src="https://www.instagram.com/embed.js"></script>
<script async src="https://www.threads.net/embed.js"></script>
<script async src="https://www.tiktok.com/embed.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* ============ 디자인 토큰 ============ */
:root{
  --page-bg:#FFFFFF;
  --surface:#FFFFFF;
  --ink:#221F1C;
  --ink-soft:#8B8580;
  --ink-faint:#C2BDB6;
  --line:#EAE7E1;
  --line-strong:#DEDAD2;

  --accent:#4A4642;
  --accent-soft:#ECECEC;

  --danger:#E8556B;
  --danger-soft:#FCE3E7;

  --c-official:#EF4444;
  --c-musical:#FACC15;
  --c-broadcast:#0EA5E9;
  --c-sns:#8B5CF6;
  --c-solardo:#F472B6;
  --c-concert:#F97316;
  --c-event:#84CC16;
  --c-fansign:#0E8F4F;
  --c-anniversary:#4C63D2;
  --c-etc:#4B5563;

  --radius-xl:28px;
  --radius-lg:16px;
  --radius-md:12px;
  --radius-sm:9px;
  --shadow-card:0 24px 60px rgba(30,24,15,.08);
  --shadow-soft:0 4px 14px rgba(30,24,15,.05);
  --shadow-pop:0 16px 40px rgba(30,24,15,.18);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-x:hidden;}
body{
  font-family:'Pretendard Variable','Pretendard', system-ui, sans-serif;
  background:var(--page-bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

/* 문서 스크롤바: PC(마우스 환경)에서만 커스텀 바를 보여주고, 모바일/터치에서는 숨김 */
@media (hover:hover) and (pointer:fine){
  html{ scrollbar-width:thin; scrollbar-color:rgba(0,0,0,.18) transparent; }
  html::-webkit-scrollbar{ width:6px; }
  html::-webkit-scrollbar-track{ background:transparent; }
  html::-webkit-scrollbar-thumb{ background:#fff; border:1px solid rgba(0,0,0,.15); background-clip:padding-box; border-radius:999px; }
  html::-webkit-scrollbar-thumb:hover{ background:#fff; border-color:rgba(0,0,0,.28); }
}
@media not all and (hover:hover) and (pointer:fine){
  html{ scrollbar-width:none; }
  html::-webkit-scrollbar{ display:none; width:0; height:0; }
}

.page-outer{
  max-width:960px;
  margin:0 auto;
  padding:14px 18px 80px;
  overflow-x:hidden;
}

/* ============ 카드 ============ */
.app-card{
  background:var(--surface);
  border-radius:var(--radius-xl);
  padding:30px 30px 22px;
  border:1px solid #dedcd6;
  box-shadow:none;
}

/* ============ 헤더 ============ */
.app-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  margin-bottom:22px;
}
.wordmark{
  margin:0;
  font-weight:800;
  font-size:26px;
  letter-spacing:-0.02em;
  color:var(--ink);
}
.wordmark-thin{
  font-weight:500;
  color:var(--ink-soft);
}
.wordmark-caption{
  margin:4px 0 0;
  font-size:12.5px;
  color:var(--ink-faint);
  font-weight:600;
}

/* ============ D-day 스트립 ============ */
.dday-strip{
  display:flex;
  align-items:center;
  gap:14px;
  background:var(--accent-soft);
  border-radius:var(--radius-lg);
  padding:12px 18px;
  margin-bottom:18px;
}
.dday-number{
  font-weight:800;
  font-size:20px;
  min-width:52px;
}
.dday-divider{
  width:1px;
  align-self:stretch;
  background:rgba(0,0,0,.1);
}
.dday-body{display:flex;flex-direction:column;gap:2px;min-width:0;}
.dday-label{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75;}
.dday-title-row{display:flex;align-items:center;gap:7px;min-width:0;}
.dday-dot{width:6px;height:6px;border-radius:50%;flex:none;}
.dday-title{font-size:13.5px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dday-date{font-size:11.5px;color:var(--ink-soft);}

/* ============ 오늘의 캐스트 스트립 ============ */
.cast-strip{
  display:flex;
  align-items:center;
  gap:14px;
  background:var(--accent-soft);
  border-radius:var(--radius-lg);
  padding:12px 18px;
  margin-bottom:10px;
}
.cast-head{display:flex;flex-direction:column;gap:1px;flex:none;max-width:45%;}
.cast-sub{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--accent);}
.cast-title{font-size:15px;font-weight:800;color:var(--accent);line-height:1.3;word-break:keep-all;overflow-wrap:anywhere;}
.cast-list{display:flex;flex-direction:column;gap:6px;min-width:0;}
.cast-row{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;min-width:0;}
.cast-dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--c-musical);align-self:center;}
.cast-time{font-size:14px;font-weight:800;color:var(--ink);}
.cast-names{font-size:13px;color:var(--ink-soft);white-space:pre-wrap;word-break:break-word;min-width:0;}
.cast-badge{background:#FEF08A;color:#713F12;border-radius:999px;padding:0 8px;font-size:11px;font-weight:700;line-height:1.6;}

/* ============ 뮤지컬 공연 정보 입력칸(모달) ============ */
.musical-fields{
  display:none;
  background:#FEFCE8;
  border:1px solid #FDE047;
  border-radius:var(--radius-md);
  padding:2px 12px 12px;
  margin-top:12px;
}
.musical-fields.show{display:block;}
.check-row{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;cursor:pointer;}
.modal .check-row input{width:18px;height:18px;padding:0;margin:0;accent-color:var(--ink);cursor:pointer;}

/* 커튼콜이 있는 날: 달력 칸 왼쪽 위 모서리에 뮤지컬 색 삼각 리본 (날짜 숫자는 오른쪽에 있어서 겹치지 않음) */
#calendar .fc-daygrid-day.curtain-day .fc-daygrid-day-frame::after{
  content:'';
  position:absolute;
  top:0;left:0;
  width:0;height:0;
  border-top:18px solid var(--c-musical);
  border-right:18px solid transparent;
  pointer-events:none;
}

/* ============ 툴바 ============ */
.toolbar-row{
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:10px;
  margin-bottom:18px;
  width:100%;
  min-width:0;
}
.filter-row{
  display:flex;
  gap:18px;
  overflow-x:auto;
  scrollbar-width:none;
  width:100%;
  max-width:100%;
  min-width:0;
  padding:0 2px;
}
.filter-row::-webkit-scrollbar{display:none;}
/* 알약 대신 "점 + 글자" 텍스트 탭. 선택되면 굵어지고 색 밑줄이 생김 */
.filter-chip{
  flex:none;
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px 0 7px;
  border:none;
  border-bottom:2px solid transparent;
  border-radius:0;
  background:none;
  font-size:12.5px;
  font-weight:600;
  color:var(--ink-soft);
  cursor:pointer;
  user-select:none;
  transition:color .15s ease, border-color .15s ease;
  white-space:nowrap;
}
.filter-chip:hover{color:var(--ink);}
.filter-chip .dot{width:6px;height:6px;border-radius:50%;flex:none;}
.filter-chip.active{color:var(--ink);font-weight:700;border-bottom-color:var(--chip-color,var(--ink));}
.filter-chip.all{color:var(--ink);}
.filter-chip.all:not(.active){color:var(--ink-soft);}

.search-box{
  position:relative;
  display:flex;
  align-items:center;
  flex:none;
  width:100%;
}
.search-box i{position:absolute;left:2px;font-size:12px;color:var(--ink-faint);}
.search-box input{
  width:100%;
  padding:9px 4px 9px 26px;
  border:none;
  border-bottom:1px solid var(--line-strong);
  border-radius:0;
  background:transparent;
  font-family:inherit;
  font-size:12.5px;
  color:var(--ink);
}
.search-box input:focus{border-bottom-color:var(--ink);}
.search-box input::placeholder{color:var(--ink-faint);}

/* ============ 아바타 스택 (사진 버전용) ============ */
.avatar-stack{display:flex;align-items:center;flex:none;}
.avatar-stack img{
  width:34px;height:34px;border-radius:50%;
  object-fit:cover;
  border:2.5px solid var(--surface);
  box-shadow:0 2px 6px rgba(30,24,15,.12);
  margin-left:-10px;
}
.avatar-stack img:first-child{margin-left:0;}

/* ============ 달력 ============ */
.calendar-wrap{overflow-y:auto;}
@media (hover:hover) and (pointer:fine){
  .calendar-wrap{scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.18) transparent;}
  .calendar-wrap::-webkit-scrollbar{width:6px;}
  .calendar-wrap::-webkit-scrollbar-track{background:transparent;}
  .calendar-wrap::-webkit-scrollbar-thumb{background:#fff;border:1px solid rgba(0,0,0,.15);background-clip:padding-box;border-radius:999px;}
  .calendar-wrap::-webkit-scrollbar-thumb:hover{background:#fff;border-color:rgba(0,0,0,.28);}
}
@media not all and (hover:hover) and (pointer:fine){
  .calendar-wrap{scrollbar-width:none;}
  .calendar-wrap::-webkit-scrollbar{display:none;width:0;height:0;}
}
#calendar{padding:0;}

.fc{font-family:'Pretendard Variable','Pretendard',system-ui,sans-serif;}
.fc-event{border:none!important;box-shadow:none!important;border-radius:6px!important;}
.fc .fc-toolbar-title{
  font-weight:800;
  font-size:18px;
  letter-spacing:-0.01em;
  color:var(--ink);
}
.fc .fc-toolbar.fc-header-toolbar{margin-bottom:14px;}
.fc .fc-toolbar-chunk{display:flex;align-items:center;gap:4px;}
.fc .fc-button-group{display:inline-flex;gap:2px;}
.fc .fc-button-group>.fc-button{margin-left:0!important;}
/* 기본 버튼: 테두리·배경 없는 텍스트 버튼 */
.fc .fc-button{
  font-family:inherit;
  font-size:12px;
  font-weight:600;
  padding:6px 7px;
  background:transparent!important;
  color:var(--ink-soft);
  border:none!important;
  border-radius:0;
}
.fc .fc-button:focus,.fc .fc-button:active{background:transparent!important;}
.fc .fc-button:hover{background:transparent!important;color:var(--ink);}
.fc .fc-button:disabled{opacity:.35;}
.fc .fc-button .fc-icon{font-size:1.35em;}
/* 유일한 강조 버튼: 일정 추가 (진한 알약) */
.fc .fc-customAddBtn-button{
  background:var(--ink)!important;color:#fff!important;
  border-radius:999px!important;padding:6px 13px;font-size:11.5px;font-weight:700;
  letter-spacing:-0.01em;line-height:1;margin-left:0;
}
.fc .fc-customAddBtn-button:hover{background:var(--ink)!important;color:#fff!important;filter:brightness(1.2);}
/* 수정 / 오늘: 일정 추가와 같은 알약 모양 (색으로 구분) */
.fc .fc-modifyBtn-button,
.fc .fc-today-button{
  border-radius:999px!important;padding:5px 12px;font-size:11.5px;font-weight:700;
  letter-spacing:-0.01em;line-height:1;
}
.fc .fc-modifyBtn-button{
  background:var(--surface)!important;color:var(--ink)!important;
  border:1px solid var(--line-strong)!important;
}
.fc .fc-modifyBtn-button:hover{background:#F5F4F1!important;color:var(--ink)!important;}
/* 수정모드 ON 상태 표시: 버튼 DOM을 직접 건드리지 않고 상위 컨테이너 클래스로만 제어.
   (캘린더가 검색/필터 등으로 다시 그려져도 항상 정확하게 유지됨) */
#calendar.modify-active .fc-modifyBtn-button{background:#E8556B!important;color:#fff!important;border-color:#E8556B!important;}
.fc .fc-today-button{
  background:var(--danger-soft)!important;color:var(--danger)!important;
  border:1px solid var(--danger-soft)!important;
}
.fc .fc-today-button:hover{background:var(--danger-soft)!important;color:var(--danger)!important;filter:brightness(.96);}
.fc .fc-today-button:disabled{opacity:.65;}
.fc-daygrid-day-number{font-size:10.5px;color:var(--ink-soft);font-weight:600;}
.fc-col-header-cell-cushion{
  font-size:10.5px;
  color:var(--ink-faint);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.06em;
  padding:8px 0;
}
.fc-theme-standard td, .fc-theme-standard th{border-color:var(--line)!important;}
.fc .fc-daygrid-day.fc-day-today{background:var(--accent-soft)!important;}
.fc-daygrid-day-frame{padding:2px;}
.fc-daygrid-day{cursor:pointer;}

*:focus{outline:none!important;box-shadow:none!important;}
.fc *:focus{outline:none!important;box-shadow:none!important;}

.event-icon{width:1em;height:1em;object-fit:contain;vertical-align:middle;margin-left:2px;}
.event-icon.bstage{width:calc(1em + 1pt);height:calc(1em + 1pt);}

/* ============ 달력 ↔ 떡밥 연동 ============ */
.search-line{display:flex;align-items:center;gap:16px;width:100%;min-width:0;}
.search-line .search-box{flex:1;min-width:0;width:auto;}
.overlay-toggle{
  flex:none;display:flex;align-items:center;gap:5px;
  padding:8px 2px 7px;border:none;border-bottom:2px solid transparent;border-radius:0;background:none;
  font-family:inherit;font-size:12px;font-weight:600;color:var(--ink-soft);
  cursor:pointer;white-space:nowrap;transition:color .15s ease, border-color .15s ease;
}
.overlay-toggle:hover{color:var(--ink);}
.overlay-toggle.active{color:var(--ink);font-weight:700;border-bottom-color:var(--ink);}

.search-results{
  border:1px solid var(--line);border-radius:var(--radius-md);
  padding:8px 10px;max-height:260px;overflow-y:auto;background:var(--surface);
}
.sr-head{font-size:11px;font-weight:700;color:var(--ink-faint);margin:6px 2px 4px;}
.sr-head b{color:var(--ink-soft);}
.sr-row{
  display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:8px;
  cursor:pointer;font-size:12px;min-width:0;
}
.sr-row:hover{background:#F5F4F1;}
.sr-dot{width:7px;height:7px;border-radius:50%;flex:none;}
.sr-date{flex:none;width:34px;font-size:11px;font-weight:700;color:var(--ink-soft);}
.sr-main{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--ink);}
.sr-tag{flex:none;font-size:10.5px;font-weight:600;color:var(--ink-soft);}
.sr-more,.sr-empty{font-size:11px;color:var(--ink-faint);padding:4px 6px;}

/* 떡밥 표시: 일정이 많아 셀이 길어져도, 각 셀의 "맨 아래에서 일정 거리 위"에 고정 */
.sched-feed-dots{
  position:absolute;left:5px;right:5px;bottom:4px;
  display:flex;align-items:center;gap:3px;
  margin:0;padding:0;cursor:pointer;
  font-size:9px;color:var(--ink-soft);line-height:1;
}
/* 떡밥 줄이 있는 셀만 아래 공간을 확보해서 일정과 겹치지 않게 함 */
.fc-daygrid-day-frame:has(> .sched-feed-dots){padding-bottom:17px;}
.sched-feed-dots i{font-size:9px;color:var(--ink-faint);}
.sched-feed-dots .sfd-dots{display:flex;align-items:center;gap:3px;min-width:0;overflow:hidden;}
.sched-feed-dots .sfd-dot{width:5px;height:5px;border-radius:50%;flex:none;}
.sched-feed-dots .sfd-count{flex:none;font-weight:700;margin-left:1px;}
/* 일정에 연결된 떡밥: 일정 막대 맨 아래 작은 한 줄(카메라 + 개수). 제목 폭은 그대로 */
.event-feed-badge{
  display:flex;align-items:center;justify-content:flex-end;gap:3px;
  margin-top:3px;padding-top:2px;
  border-top:0.5px solid rgba(255,255,255,.45);
  font-size:.85em;font-weight:700;line-height:1.2;cursor:pointer;
}
.event-feed-badge i{font-size:.9em;}

.feed-item-event{
  display:inline-flex;align-items:center;gap:4px;max-width:100%;
  margin-top:3px;padding:1px 8px;border-radius:999px;
  background:var(--accent-soft);color:var(--ink-soft);
  font-size:10.5px;font-weight:600;cursor:pointer;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.feed-item-event i{font-size:9px;}

.efm-sub{font-size:11.5px;color:var(--ink-soft);margin:-8px 0 14px;}
.efm-item{margin:8px 0 0;padding:9px 10px 9px 12px;border-left:3px solid transparent;border-radius:8px;}
.efm-item.clickable{cursor:pointer;}
.efm-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.efm-cat{font-size:11.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;}
.efm-goto{font-size:10.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
.efm-goto i{font-size:8px;}
.efm-memo{font-size:12px;color:var(--ink-soft);margin-top:3px;word-break:break-word;white-space:pre-wrap;}

.month-summary{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);}
.ms-head{display:flex;align-items:baseline;gap:8px;margin-bottom:12px;}
.ms-title{font-weight:800;font-size:14.5px;color:var(--ink);}
.ms-year{font-size:11px;color:var(--ink-faint);}
.ms-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:6px;}
.ms-tile{background:#F7F6F3;border-radius:var(--radius-md);padding:10px 12px;min-width:0;}
.ms-tile.clickable{cursor:pointer;}
.ms-tile.clickable:hover{background:#F0EEEA;}
.ms-num{font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--ink);}
.ms-lab{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.ms-block{margin-top:12px;}
.ms-block-title{font-size:11px;font-weight:700;color:var(--ink-faint);margin-bottom:6px;}
.ms-bar{display:flex;height:8px;border-radius:999px;overflow:hidden;gap:2px;}
.ms-seg{min-width:4px;}
.ms-chips{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;}
.ms-chip{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ink-soft);}
.ms-chip .dot{width:7px;height:7px;border-radius:50%;flex:none;}
.ms-empty{font-size:12px;color:var(--ink-faint);padding:4px 0;}

/* ============ 모달 ============ */
.modal{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  background:var(--surface);
  padding:22px 22px 20px;
  border-radius:var(--radius-xl);
  width:340px;
  max-width:90%;
  max-height:82%;
  overflow-y:auto;
  display:none;
  z-index:9999;
  box-shadow:var(--shadow-pop);
}
@media (hover:hover) and (pointer:fine){
  .modal{scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.18) transparent;}
  .modal::-webkit-scrollbar{width:6px;}
  .modal::-webkit-scrollbar-track{background:transparent;}
  .modal::-webkit-scrollbar-thumb{background:#fff;border:1px solid rgba(0,0,0,.15);background-clip:padding-box;border-radius:999px;}
  .modal::-webkit-scrollbar-thumb:hover{background:#fff;border-color:rgba(0,0,0,.28);}
}
@media not all and (hover:hover) and (pointer:fine){
  .modal{scrollbar-width:none;}
  .modal::-webkit-scrollbar{display:none;width:0;height:0;}
}
.modal.show{display:block;}
.modal h3{
  font-weight:800;
  font-size:17px;
  letter-spacing:-0.01em;
  margin:0 0 16px;
  color:var(--ink);
}
.modal .close-btn{
  position:absolute;top:14px;right:14px;

.btn-secondary:hover{background:#E2E2E2;}

/* ============ 메모 보기 모달 ============ */
.memo-title{

}

/* ============ 범례 ============ */
.legend{

  gap:6px 12px;
  justify-content:center;
  margin:18px 0 0;
}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ink-soft);}
.legend-item .dot{width:7px;height:7px;border-radius:50%;flex:none;}

footer.site-footer{

  color:var(--ink-faint);
}

/* ============ 반응형 ============ */

  .fc .fc-toolbar-title{font-size:15px;}

  .fc .fc-toolbar-chunk{gap:3px;}
  .fc .fc-customAddBtn-button{padding:5px 10px;font-size:11px;margin-left:0;}
  .fc .fc-modifyBtn-button,.fc .fc-today-button{padding:4px 9px;font-size:11px;}

  .sched-feed-dots{left:3px;right:3px;bottom:2px;gap:2px;overflow:hidden;}
  .sched-feed-dots i{display:none;}
  .sched-feed-dots .sfd-dots{display:flex;}
  .sched-feed-dots .sfd-dot{width:4.5px;height:4.5px;}
  .sched-feed-dots .sfd-count{display:none;}

  .overlay-toggle{font-size:11.5px;}

  .search-box input{font-size:16px;}

  .legend{
    flex-wrap:nowrap;
    gap:0 6px;
    margin:14px 0 0;
    overflow-x:auto;
  }
  .legend-item{font-size:8px;gap:2px;white-space:nowrap;}
  .legend-item .dot{width:5px;height:5px;}
  /* 월간 요약: 4개 타일이 좁은 화면에서 줄바꿈되지 않고 한 줄에 들어가도록 강제 고정 */
  .ms-tiles{grid-template-columns:repeat(4,1fr);gap:5px;}
  .ms-tile{padding:8px 6px;}
  .ms-num{font-size:13px;letter-spacing:-.01em;}
  .ms-lab{font-size:8.3px;line-height:1.25;margin-top:3px;word-break:keep-all;}
}
@media (max-width:600px) and (hover:hover) and (pointer:fine){
  .legend{scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.18) transparent;}
  .legend::-webkit-scrollbar{height:6px;}
  .legend::-webkit-scrollbar-track{background:transparent;}
  .legend::-webkit-scrollbar-thumb{background:#fff;border:1px solid rgba(0,0,0,.15);background-clip:padding-box;border-radius:999px;}
  .legend::-webkit-scrollbar-thumb:hover{background:#fff;border-color:rgba(0,0,0,.28);}
}
@media (max-width:600px) and (not (hover:hover)){
  .legend{scrollbar-width:none;}
  .legend::-webkit-scrollbar{display:none;width:0;height:0;}

/* ============ 처음으로 (뒤로가기) ============ */
.back-link-wrap{
  max-width:960px;
  margin:0 auto;
  padding:22px 18px 0;
}
.back-link{
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:12px;
  color:var(--ink-soft);
  text-decoration:none;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.back-link svg{flex-shrink:0;}

/* ============ 탭 바 (스케줄 / 떡밥) - 슬라이드 토글 ============ */
.tab-bar{
  display:flex;
  justify-content:center;
  max-width:960px;
  margin:0 auto;
  padding:14px 18px 0;
  margin-bottom:18px;
}
.tab-toggle{
  position:relative;
  display:flex;
  width:min(320px,100%);
  padding:3px;
  border-radius:999px;
  background:var(--accent-soft);
}
.tab-slider{
  position:absolute;
  top:3px;bottom:3px;left:3px;
  width:calc(50% - 3px);
  border-radius:999px;
  background:var(--surface);
  border:0.5px solid var(--line-strong);
  transition:transform .25s cubic-bezier(.4,0,.2,1);
}
.tab-bar[data-active="feed"] .tab-slider{transform:translateX(100%);}
.tab-btn{
  position:relative;
  z-index:1;
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:9px 0;
  border:none;
  border-radius:999px;
  background:transparent;
  color:var(--ink-soft);
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  box-shadow:none;
  transition:color .2s ease;
}
.tab-btn i{font-size:13px;}
.tab-btn.active{color:var(--ink);background:transparent;}

/* ============ 떡밥 탭: 달력 + 패널 (PC/모바일 모두 세로 배치) ============ */
.feed-shell{
  display:flex;
  flex-direction:column;
  gap:18px;
  align-items:stretch;
}
.feed-calendar-col{width:100%;min-width:0;}
.feed-panel-col{width:100%;}

#feedCalendar .fc-event{display:none!important;}
.feed-dots{display:flex;flex-direction:column;align-items:flex-start;gap:1px;justify-content:flex-start;padding:0 4px;margin-top:1px;}
.feed-dots-row{display:grid;grid-template-columns:repeat(3,6px);gap:3px;}
.feed-dots .feed-count{font-size:8.5px;font-weight:700;color:var(--ink-soft);margin-left:0;line-height:1;}
.feed-dot{
  width:6px;height:6px;border-radius:50%;
  flex:none;
}
/* 떡밥 탭 캘린더: 칸 안에는 메모 목록(최대 5개 + 나머지는 +N개), 칸 맨 아래에는 카테고리별 점 */
.feed-chips{display:flex;flex-direction:column;gap:2px;padding:0 3px;margin-top:2px;min-width:0;}
.feed-chip{
  display:block;padding:1px 2px;
  color:var(--ink);font-size:8pt;font-weight:500;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.feed-chip-dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;
  margin-right:4px;vertical-align:0;
}
.feed-chip .feed-chip-icon{display:inline-block;width:11px;margin-right:4px;font-size:9.5px;text-align:center;line-height:1;vertical-align:-1px;}
.feed-chip img.feed-chip-icon{width:10px;height:10px;object-fit:contain;vertical-align:-1px;}
.feed-chips .feed-more{font-size:8.5px;font-weight:700;color:var(--ink-soft);line-height:1;padding-left:2px;}
/* 달력 탭의 떡밥 점(.sched-feed-dots)과 똑같은 위치·여백값: 목록 ↔ 점 간격이 두 탭에서 같도록 맞춤 */
.feed-cal-dots{
  position:absolute;left:5px;right:5px;bottom:4px;height:9px;
  display:flex;align-items:center;gap:3px;
  overflow:hidden;pointer-events:none;
}
.fc-daygrid-day-frame:has(> .feed-cal-dots){padding-bottom:22px;}
.feed-cal-dots .fcd-dot{width:5px;height:5px;border-radius:50%;flex:none;}
@media (max-width:600px){
  .feed-chips{gap:1px;padding:0 2px;}
  .feed-chip{font-size:7px;padding:1px 1px;}
  .feed-chip-dot{width:5px;height:5px;margin-right:3px;}
  .feed-chip .feed-chip-icon{width:8px;margin-right:3px;font-size:7px;}
  .feed-chip img.feed-chip-icon{width:7px;height:7px;}
  .feed-cal-dots{left:3px;right:3px;bottom:2px;height:auto;gap:2px;}
  .feed-cal-dots .fcd-dot{width:4.5px;height:4.5px;}
  .fc-daygrid-day-frame:has(> .feed-cal-dots){padding-bottom:15px;}
}
.fc-daygrid-day.feed-has-entry{cursor:pointer;}
.fc-daygrid-day.feed-selected{background:var(--accent-soft)!important;}

/* ============ 떡밥 탭: 오른쪽(또는 하단) 패널 ============ */
.feed-panel{
  border-top:1px solid var(--line);
  padding:18px 0 0;
}
.feed-panel-date{
  font-weight:800;
  font-size:14.5px;
  color:var(--ink);
  margin:0 0 2px;
}
.feed-panel-sub{
  font-size:11px;
  color:var(--ink-faint);
  margin:0 0 14px;
}
.feed-item{
  position:relative;
  margin:0;
  padding:14px 0;
  border:none;
  border-bottom:1px solid var(--line);
  border-radius:0;
  background:transparent;
}
/* 모든 행의 위 여백을 똑같이 두고 목록 전체만 위로 당겨서, 1열/2열 모두 첫 줄 높이가 맞도록 함 */
.feed-list{margin-top:-10px;}
/* 화면이 넓을 때(820px 이상)만 2열로 나눠서 세로 스크롤을 줄임. 모바일은 1열 */
.feed-list .feed-item{break-inside:avoid;}
@media (min-width:820px){
  .feed-list{column-count:2;column-gap:28px;}
  .feed-list .feed-item.feed-item-editing{column-span:all;}
}

/* 트위터(X) 스타일 카드 - 임베드 유무와 상관없이 전부 통일 */
.feed-item-tw{display:flex;align-items:flex-start;gap:12px;}
.feed-item-tw .ftw-avatar{
  width:40px;height:40px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
}
.feed-item-tw .ftw-avatar-icon{color:#fff;font-size:16px;}
.feed-item-icon{font-size:11px;color:var(--ink-soft);margin-right:5px;width:1em;height:1em;object-fit:contain;}
.feed-item-tw .ftw-body{flex:1;min-width:0;}
.feed-item-tw .ftw-head{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.feed-item-tw .ftw-name{font-size:14px;font-weight:700;color:var(--ink);}
.feed-item-tw .ftw-time{font-size:12.5px;color:var(--ink-soft);}
.feed-item-tw .feed-item-event{margin-top:0;}
.feed-item-memo{font-size:14px;color:var(--ink);line-height:1.5;margin-top:2px;word-break:break-word;white-space:pre-wrap;}
.feed-item-clickable{cursor:pointer;transition:filter .15s ease;}
.feed-item-clickable:hover{filter:brightness(0.97);}
.feed-item-clickable:active{filter:brightness(0.93);}
.feed-item-actions{display:flex;gap:14px;flex:none;margin-left:auto;}
.feed-item-actions i{font-size:12px;color:var(--ink-faint);cursor:pointer;}
.feed-item-actions .fa-trash:hover{color:var(--danger);}
.feed-item-actions .fa-pen:hover{color:var(--accent);}

.feed-empty{font-size:12px;color:var(--ink-faint);padding:8px 0 14px;}
.feed-filter-row{margin:0 0 14px;}

.feed-embed{margin-top:10px;max-width:360px;}
/* 임베드 폭/축소(zoom)는 JS(fitEmbed)가 열 폭에 맞춰 인라인으로 지정 (zoom 미지원 브라우저는 원래 크기) */
.feed-embed-yt{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;}
.feed-embed-yt iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}
.feed-embed-tw{max-width:100%;overflow:hidden;}
.feed-embed-tw .twitter-tweet{margin:0!important;max-width:100%!important;}
.feed-embed-tw iframe{max-width:100%!important;}
.feed-embed-ig{max-width:100%;overflow:hidden;display:flex;justify-content:center;}
.feed-embed-ig iframe{max-width:100%!important;}
.feed-embed-th{max-width:100%;overflow:hidden;}
.feed-embed-th iframe{max-width:100%!important;}
.feed-embed-tt{max-width:100%;overflow-x:auto;display:flex;justify-content:center;}
.feed-embed-fb{max-width:100%;overflow-x:auto;}
.feed-embed-fb iframe{max-width:100%;}
.feed-embed-fallback{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:4px;font-size:11.5px;color:var(--accent);
  text-decoration:none;
}

/* 등록 폼은 달력 바로 아래(목록 위)에 고정 — 떡밥이 늘어나도 폼 위치는 그대로 */
.feed-add-form{margin:10px 0 18px;}
.feed-add-form select,.feed-add-form input,.feed-add-form textarea{
  width:100%;
  padding:8px 10px;
  border:1px solid var(--line-strong);
  border-radius:var(--radius-sm);
  font-family:inherit;
  font-size:12.5px;
  color:var(--ink);
  background:var(--surface);
  margin-bottom:7px;
}
.feed-add-form textarea{resize:vertical;}
.feed-add-btn{
  width:100%;
  padding:9px;
  border:none;
  border-radius:999px;
  background:var(--ink);
  color:#fff;
  font-family:inherit;
  font-size:12.5px;
  font-weight:700;
  cursor:pointer;
}
.feed-add-btn:hover{background:#3A362F;}
.feed-panel-placeholder{font-size:12.5px;color:var(--ink-faint);text-align:center;padding:26px 0;}

/* ============ 떡밥 아이템 수정 폼 ============ */
.feed-item.feed-item-editing{
  background:var(--page-bg)!important;
  padding:12px;margin:10px 0;
  border:0.5px solid var(--line);border-radius:14px;
}
.feed-item-editing select,.feed-item-editing input,.feed-item-editing textarea{
  width:100%;
  padding:8px 10px;
  border:1px solid var(--line-strong);
  border-radius:var(--radius-sm);
  font-family:inherit;
  font-size:12.5px;
  color:var(--ink);
  background:var(--surface);
  margin-bottom:7px;
}
.feed-item-editing textarea{resize:vertical;}
.feed-edit-actions{display:flex;gap:8px;}
.feed-save-btn,.feed-cancel-btn{
  flex:1;
  padding:8px;
  border-radius:999px;
  font-family:inherit;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}
.feed-save-btn{border:none;background:var(--ink);color:#fff;}
.feed-save-btn:hover{background:#3A362F;}
.feed-cancel-btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);}
.feed-cancel-btn:hover{background:#F5F4F1;}

@media(max-width:600px){
  .back-link-wrap{padding:16px 10px 0;}
  .tab-bar{padding:10px 10px 0;margin-bottom:12px;}
  .feed-add-form select,.feed-add-form input,.feed-add-form textarea{font-size:16px;}
}

<script>
firebase.initializeApp({
  apiKey:"AIzaSyD7PwhcOZpYMEm4znPSkCTkKM2ZJzlmX0k",

  projectId:"yong-schedule"

const db = firebase.firestore();

// ============ 탭 전환 ============
const calendarView = document.getElementById('calendarView');
const feedView = document.getElementById('feedView');

function activateTab(btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const tabBarEl = document.getElementById('tabBar');
  if(tabBarEl) tabBarEl.dataset.active = btn.dataset.tab;
  calendarView.style.display='none';
  feedView.style.display='none';
  if(btn.dataset.tab==='feed'){
    feedView.style.display='block';
    if(window.feedCalendar) window.feedCalendar.updateSize();
  } else {
    calendarView.style.display='block';
  }
}

document.querySelectorAll('.tab-btn[data-tab]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if(btn.classList.contains('active')) return;
    navSave();                 // 떠나기 전 현재 위치를 히스토리에 저장
    activateTab(btn);
    navPush(captureNavState()); // 새 탭을 히스토리에 쌓아서 뒤로가기로 돌아올 수 있게
  });
});

// ============ 링크 → 아이콘 매핑 (일정 / 떡밥 공용) ============
function getLinkIcon(link, iconClass){
  iconClass = iconClass || 'event-icon';
  if(!link) return '';
  if(link.includes('instagram')) return `<i class="fab fa-instagram ${iconClass}"></i>`;
  else if(link.includes('youtube.com') || link.includes('youtu.be')) return `<i class="fab fa-youtube ${iconClass}"></i>`;
  else if(link.includes('facebook')) return `<i class="fab fa-facebook ${iconClass}"></i>`;
  else if(link.includes('tiktok')) return `<i class="fab fa-tiktok ${iconClass}"></i>`;
  else if(link.includes('threads')) return `<i class="fab fa-threads ${iconClass}"></i>`;
  else if(link.includes('kakaotalk')) return `<i class="fab fa-kakaotalk ${iconClass}"></i>`;
  else if(link.includes('naver')) return `<i class="fab fa-naver ${iconClass}"></i>`;
  else if(link.includes('github')) return `<i class="fab fa-github ${iconClass}"></i>`;
  else if(link.includes('twitter.com') || link.includes('x.com')) return `<i class="fab fa-x-twitter ${iconClass}"></i>`;
  else if(link.includes('bstage') || link.includes('https://solarkeem.com'))
    return `<img src="https://i.namu.wiki/i/-BYbNrH2E_lYZNZnTZ7oJu1CdynHFQs8OczMZ4Qd2Jm2oGAgWJPTjoOi6LTBZnWumb_KFv7GSJhtp9B69w1fXA.svg" class="${iconClass} bstage">`;
  else return `<i class="fas fa-link ${iconClass}"></i>`;
}

// ============ 색상 정의 ============
const eventColorHex = {
  '공식':'#EF4444','방송':'#0EA5E9','SNS':'#8B5CF6',
  '뮤지컬':'#FACC15','콘서트·팬미팅':'#F97316','행사':'#84CC16','팬사인회':'#0E8F4F',
  '솔라시도':'#F472B6','발매·기념일':'#4C63D2','기타':'#4B5563'
};

const legendTypes = Object.keys(eventColorHex);

document.getElementById('legend').innerHTML = legendTypes.map(k=>
  `<div class="legend-item"><span class="dot" style="background:${eventColorHex[k]}"></span>${k}</div>`
).join('');

// ============ 필터 칩 ============
const filterRow = document.getElementById('filterRow');
// 선택된 범례가 없으면(기본) 모든 일정 표시, 선택하면 해당 범례의 일정만 표시
// '전체' 칩: 전체 표시 <-> 전체 숨김 토글 (hideAllTypes = 전체 숨김 상태)
let activeTypes = new Set();
let hideAllTypes = false;
const isTypeVisible = t => !hideAllTypes && (activeTypes.size === 0 || activeTypes.has(t));

function renderFilterChips(){
  const allActive = !hideAllTypes && (activeTypes.size === 0 || activeTypes.size === Object.keys(eventColorHex).length);
  const allChip = `<div class="filter-chip all${allActive?' active':''}" data-all="1">전체</div>`;
  const chips = Object.keys(eventColorHex).map(k=>{
    const isActive = activeTypes.has(k);
    const c = eventColorHex[k];
    return `<div class="filter-chip${isActive?' active':''}" data-type="${k}" style="--chip-color:${c};">
      <span class="dot" style="background:${c}"></span>${k}
    </div>`;
  }).join('');
  filterRow.innerHTML = allChip + chips;
}

filterRow.addEventListener('click', (e)=>{
  const chip = e.target.closest('.filter-chip');
  if(!chip) return;
  if(chip.dataset.all){
    // 전체: 이미 전체 표시 중이면 전체 숨김, 아니면 전체 표시로 되돌림
    const wasAllOn = !hideAllTypes && (activeTypes.size === 0 || activeTypes.size === Object.keys(eventColorHex).length);
    hideAllTypes = wasAllOn;
    activeTypes = new Set();
  } else {
    hideAllTypes = false;
    const t = chip.dataset.type;
    if(activeTypes.has(t)) activeTypes.delete(t);
    else activeTypes.add(t);
  }
  renderFilterChips();
  refreshCalendarEvents();
});

renderFilterChips();

// ============ 검색 ============
// 타이핑할 때마다 즉시 다시 그리지 않고, 입력이 잠깐(200ms) 멈췄을 때만
// 다시 그리도록 디바운스 처리. 일정이 많아져도 매 키 입력마다 캘린더를
// 통째로 다시 그리는 부담이 없어진다.
const searchInput = document.getElementById('searchInput');
let searchDebounceTimer = null;
searchInput.addEventListener('input', ()=>{
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(refreshCalendarEvents, 200);
});

// ============ 모달 ============
const modal=document.getElementById('modal');
const memoViewModal = document.getElementById('memoViewModal');
const memoViewContent = document.getElementById('memoViewContent');

memoViewModal.querySelector('.close-btn').onclick = () => memoViewModal.classList.remove('show');
modal.querySelector('.close-btn').onclick = () => modal.classList.remove('show');

let selectedEvent=null;
let modifyMode=false;
let allEventsData=[];

// ============ 뮤지컬 공연 정보(시간·캐스트·커튼콜) ============
// 뮤지컬 일정에 공연 시간/캐스트/커튼콜 여부를 따로 저장한다.
// 예전에 메모에만 캐스트를 적어둔 일정도 그대로 보이도록, 캐스트가 비어 있으면 메모를 캐스트로 대신 쓰고,
// 커튼콜 체크를 한 번도 저장한 적 없는 일정은 메모에 '커튼콜'이 들어 있으면 커튼콜로 본다.
const hasMusicalInfo = e => !!(((e.showTime||'').trim()) || ((e.cast||'').trim()) || ((e.memo||'').trim()));
const isCurtainCall = e => e.type==='뮤지컬' && (e.curtainCall==null ? /커튼콜/.test(e.memo||'') : !!e.curtainCall);

function syncMusicalFields(){
  document.getElementById('musicalFields').classList.toggle('show', eventType.value==='뮤지컬');
}
function resetMusicalFields(){
  eventShowTime.value='';
  eventCast.value='';
  eventCurtain.checked=false;
  syncMusicalFields();
}
eventType.addEventListener('change', syncMusicalFields);

function showMusicalInfo(ev){
  const x = ev.extendedProps;
  const cast = (x.cast||'').trim();
  const memo = (x.memo||'').trim();
  const structured = !!((x.showTime||'').trim() || cast);
  const head = [(x.showTime||'').trim(), isCurtainCall({...x, type:'뮤지컬'}) ? '커튼콜' : ''].filter(Boolean).join(' · ');
  const parts = [];
  if(head) parts.push(head);
  if(cast) parts.push(cast);
  if(memo) parts.push((parts.length ? '\n' : '') + memo);
  document.getElementById('memoViewTitle').textContent = structured ? '공연 정보' : 'Memo';
  memoViewContent.textContent = parts.join('\n');
  memoViewModal.classList.add('show');
}

// ============ 일정 추가 모달 열기 ============
function openAddEventModal(){
  selectedEvent=null;
  eventTitle.value='';
  eventDate.value='';
  eventLink.value='';
  eventType.value='';
  eventMemo.value='';
  resetMusicalFields();
  deleteBtn.style.display='none';
  modal.classList.add('show');
}

// ============ 수정 버튼 상태 갱신 ============
// 주의: 버튼 텍스트는 반드시 calendar.setOption()을 통해서만 바꿀 것.
// FullCalendar가 자체 렌더링 엔진(Preact 가상 DOM)으로 이 버튼을 관리하기 때문에,
// 예전처럼 btnEl.textContent를 직접 덮어쓰면 이후 캘린더가 다시 렌더링될 때
// (검색/필터/저장/삭제 등으로 refreshCalendarEvents()가 호출될 때) FullCalendar가
// 자신이 기억하는 옛 텍스트 노드를 정리하지 못하고 그 옆에 다시 끼워 넣어
// "수정수정"처럼 텍스트가 중복 표시되는 버그가 있었음.
// 배경색도 같은 이유로 버튼 DOM에 직접 style을 입히지 않고, #calendar에 클래스만
// 토글해서 CSS(.modify-active .fc-modifyBtn-button)로 표시한다. 이렇게 하면
// 캘린더가 버튼을 새로 그려도(검색/필터 등으로 다시 렌더링돼도) 항상 정확하게 유지된다.
function setModifyMode(active){
  modifyMode = active;
  calendar.setOption('customButtons', {
    customAddBtn:{text:'+ 일정 추가', click: openAddEventModal},
    modifyBtn:{text: active ? '수정 모드 ON' : '수정', click: toggleModifyMode}
  });
  document.getElementById('calendar').classList.toggle('modify-active', active);
}

function toggleModifyMode(){
  setModifyMode(!modifyMode);
}

let feedUiReady = false;

const calendar=new FullCalendar.Calendar(document.getElementById('calendar'),{
  locale:'ko', firstDay:1, fixedWeekCount:false, height:'auto', dayMinHeight: window.innerWidth <= 600 ? 66 : 104,
  headerToolbar:{left:'title',right:'prev,next today modifyBtn customAddBtn'},
  customButtons:{
    customAddBtn:{text:'+ 일정 추가', click: openAddEventModal},
    modifyBtn:{text:'수정', click: toggleModifyMode}
  },
  events:[],
  datesSet: () => { if(feedUiReady){ renderMonthSummary(); scheduleOverlayRefresh(); } },
  eventsSet: () => { if(feedUiReady) scheduleOverlayRefresh(); },
  dayCellDidMount: arg => {
    const cell = arg.el;
    let pressTimer = null;
    const HOLD_MS = 350;

    const toISODate = d => {
      const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    };

    const resetCellStyle = () => {
      cell.style.transition = 'background-color .2s ease';
      cell.style.backgroundColor = '';
    };

    const startPress = e => {
      if (e.target.closest && e.target.closest('.fc-event, .sched-feed-dots')) return;
      cell.style.transition = `background-color ${HOLD_MS}ms linear`;
      cell.style.backgroundColor = 'var(--accent-soft)';
      pressTimer = setTimeout(()=>{
        pressTimer = null;
        resetCellStyle();
        selectedEvent=null;
        eventTitle.value='';
        eventDate.value=toISODate(arg.date);
        eventLink.value='';
        eventType.value='';
        eventMemo.value='';
        resetMusicalFields();
        deleteBtn.style.display='none';
        modal.classList.add('show');
      }, HOLD_MS);
    };

    const cancelPress = () => {
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
      resetCellStyle();
    };

    cell.style.webkitUserSelect = 'none';
    cell.style.userSelect = 'none';
    cell.style.webkitTouchCallout = 'none';

    cell.addEventListener('mousedown', startPress);
    cell.addEventListener('mouseup', cancelPress);
    cell.addEventListener('mouseleave', cancelPress);
    cell.addEventListener('touchstart', startPress, {passive:true});
    cell.addEventListener('touchend', cancelPress);
    cell.addEventListener('touchcancel', cancelPress);
    cell.addEventListener('touchmove', cancelPress);
    cell.addEventListener('contextmenu', e => e.preventDefault());
  },
  eventDidMount: info => {
    // 커튼콜이 있는 뮤지컬이 있는 날짜 칸에 리본 표시용 클래스를 붙인다 (refreshCalendarEvents에서 매번 먼저 지움)
    const x = info.event.extendedProps;
    if(x.type==='뮤지컬' && isCurtainCall({...x, type:'뮤지컬'})){
      const cell = info.el.closest('.fc-daygrid-day');
      if(cell) cell.classList.add('curtain-day');
    }
  },
  eventContent: arg => {
    const type = arg.event.extendedProps.type;
    const link = arg.event.extendedProps.link;
    const memo = arg.event.extendedProps.memo;
    const hasMemo = memo && memo.trim();

    const bgColor = eventColorHex[type] || '#D9D5CE';
    const textColor = '#ffffff';
    let iconHTML = '';

    let memoIcon = '';
    if (type === '뮤지컬') {
      if (hasMusicalInfo({...arg.event.extendedProps, type})) {
        memoIcon = '<i class="fa-solid fa-note-sticky event-icon"></i>';
      }
    }

    iconHTML = getLinkIcon(link, 'event-icon');

    let len = arg.event.title.length;
    let fontSize, wrapStyle;
    if (window.innerWidth <= 600) {
      if (len <= 6) {
        fontSize = '4pt';
        wrapStyle = 'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';
      } else {
        fontSize = '3.6pt';
        wrapStyle = 'white-space:normal;overflow:visible;';
      }
    } else {
      fontSize = '8pt';
      wrapStyle = 'white-space:normal;overflow:visible;';
    }
    const feedCnt = feedUiReady ? ((feedByEvent[arg.event.id]||[]).length) : 0;
    const feedBadge = feedCnt ? `<span class="event-feed-badge" data-event-id="${arg.event.id}" title="연결된 떡밥 ${feedCnt}개 보기"><i class="fa-solid fa-camera-retro"></i>${feedCnt}</span>` : '';
    const baseStyle = `padding:2px 4px;background:${bgColor};color:${textColor};border-radius:6px !important;font-size:${fontSize};font-weight:700;word-break:break-word;${wrapStyle}`;
    const titleAttr = arg.event.title.replace(/"/g,'&quot;');
    const rowHTML = `${iconHTML} ${memoIcon} ${arg.event.title}`;
    // 떡밥이 연결된 일정: 제목 줄 아래에 배지 줄을 따로 둬서 제목이 쓰는 폭은 그대로 유지
    return {
      html: feedCnt
        ? `<div class="feed-linked" title="${titleAttr}" style="display:flex;flex-direction:column;align-items:stretch;${baseStyle}">
             <div style="display:flex;align-items:center;gap:2px;">${rowHTML}</div>${feedBadge}
           </div>`
        : `<div title="${titleAttr}" style="display:flex;align-items:center;gap:2px;${baseStyle}">
             ${rowHTML}
           </div>`
    };
  }
});
calendar.render();

// ============ 이벤트 클릭 ============
calendar.on('eventClick', info => {
  const e = info.event;
  const { type, link, memo } = e.extendedProps;

  if (modifyMode) {
    selectedEvent = e;
    eventTitle.value = e.title;
    eventDate.value = e.startStr;
    eventLink.value = link || '';
    eventType.value = type || '';
    eventMemo.value = memo || '';
    eventShowTime.value = e.extendedProps.showTime || '';
    eventCast.value = e.extendedProps.cast || '';
    eventCurtain.checked = type==='뮤지컬' && isCurtainCall({...e.extendedProps, type});
    syncMusicalFields();
    deleteBtn.style.display='inline-block';
    modal.classList.add('show');
    return;
  }

  if (type === '뮤지컬' && !link && hasMusicalInfo(e.extendedProps)) {
    showMusicalInfo(e);
    return;
  }

  // 링크와 연결된 떡밥이 둘 다 있으면 어느 쪽을 볼지 선택하게 하고,
  // 하나만 있으면 그쪽으로 바로 이동한다. (배지처럼 작은 영역을 정확히 눌러야 하는
  // 방식은 모바일에서 오탭이 잦아서, 일정 전체를 눌러도 동일하게 동작하도록 통일함)
  const feedCnt = (feedByEvent[e.id]||[]).length;
  if (link && feedCnt) {
    openLinkOrFeedChoice(e, link);
  } else if (link) {
    window.open(link, '_blank');
  } else if (feedCnt) {
    openEventFeed(e.id);
  }
});

// 링크/떡밥이 모두 연결된 일정을 눌렀을 때 선택하게 하는 모달
const linkFeedChoiceModal = document.getElementById('linkFeedChoiceModal');
linkFeedChoiceModal.querySelector('.close-btn').onclick = ()=> linkFeedChoiceModal.classList.remove('show');
let choiceEventId = null, choiceEventLink = null;
function openLinkOrFeedChoice(e, link){
  choiceEventId = e.id;
  choiceEventLink = link;
  document.getElementById('lfcTitle').textContent = e.title || '';
  linkFeedChoiceModal.classList.add('show');
}
document.getElementById('lfcLinkBtn').onclick = ()=>{
  linkFeedChoiceModal.classList.remove('show');
  if(choiceEventLink) window.open(choiceEventLink, '_blank');
};
document.getElementById('lfcFeedBtn').onclick = ()=>{
  linkFeedChoiceModal.classList.remove('show');
  if(choiceEventId) openEventFeed(choiceEventId);
};

// ============ 필터 / 검색 반영 ============
function refreshCalendarEvents(){
  document.querySelectorAll('#calendar .fc-daygrid-day.curtain-day').forEach(c=>c.classList.remove('curtain-day'));
  calendar.removeAllEvents();
  const q = searchInput.value.trim().toLowerCase();
  const filtered = allEventsData.filter(e=>
    isTypeVisible(e.type) && (!q || (e.title||'').toLowerCase().includes(q))
  );
  calendar.addEventSource(filtered);
  updateDday();
  if(feedUiReady){ renderSearchResults(); renderMonthSummary(); scheduleOverlayRefresh(); }
}

// ============ D-day 계산 ============
// ============ 오늘의 캐스트 ============
// 오늘 날짜의 뮤지컬(공연 시간·캐스트·메모가 하나라도 있는 것)을 시간순으로 보여준다.
// 반환값: 이 카드에 표시된 일정 id들 (다가오는 일정에서 같은 공연이 겹쳐 나오지 않도록 제외하는 데 씀)
function updateTodayCast(){
  const card = document.getElementById('castCard');
  const t = new Date();
  const todayStr = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;

  const shows = allEventsData
    .filter(e=>e.type==='뮤지컬' && String(e.start||'').slice(0,10)===todayStr && isTypeVisible(e.type) && hasMusicalInfo(e))
    .sort((a,b)=>{
      const ta=(a.showTime||'99:99'), tb=(b.showTime||'99:99');
      return ta<tb ? -1 : ta>tb ? 1 : 0;
    });

  card.textContent = '';
  if(shows.length===0){ card.style.display='none'; return new Set(); }

  // 같은 제목의 공연(낮/밤 공연 등)은 카드 하나에 묶고, 제목이 다르면 카드를 따로 만든다
  const groups = new Map();
  shows.forEach(e=>{
    const key = (e.title||'').trim();
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(e);
  });

  groups.forEach((items, title)=>{
    const strip = document.createElement('div');
    strip.className = 'cast-strip';

    const head = document.createElement('div');
    head.className = 'cast-head';
    const sub = document.createElement('span'); sub.className = 'cast-sub'; sub.textContent = '오늘의 캐스트';
    const ttl = document.createElement('span'); ttl.className = 'cast-title'; ttl.textContent = title;
    head.appendChild(sub); head.appendChild(ttl);
    strip.appendChild(head);

    const divider = document.createElement('div'); divider.className = 'dday-divider';
    strip.appendChild(divider);

    const list = document.createElement('div'); list.className = 'cast-list';
    items.forEach(e=>{
      const row = document.createElement('div');
      row.className = 'cast-row';
      const dot = document.createElement('span'); dot.className = 'cast-dot'; row.appendChild(dot);
      const time = (e.showTime||'').trim();
      if(time){ const el=document.createElement('span'); el.className='cast-time'; el.textContent=time; row.appendChild(el); }
      const names = (e.cast||'').trim() || (e.memo||'').trim();
      if(names){ const el=document.createElement('span'); el.className='cast-names'; el.textContent=names; row.appendChild(el); }
      if(isCurtainCall(e)){ const el=document.createElement('span'); el.className='cast-badge'; el.textContent='커튼콜'; row.appendChild(el); }
      list.appendChild(row);
    });
    strip.appendChild(list);
    card.appendChild(strip);
  });
  card.style.display='block';
  return new Set(shows.map(e=>e.id));
}

// 캐스트 카드만 보일 때는 마지막 카드 아래 간격을 원래(18px)대로, 다가오는 일정 카드가 함께 보일 때는 좁게(10px)
function syncTopCards(){
  const cast = document.getElementById('castCard');
  const dday = document.getElementById('ddayCard');
  const last = cast.lastElementChild;
  if(last) last.style.marginBottom = (dday.style.display==='none') ? '18px' : '';
}

function updateDday(){
  const card = document.getElementById('ddayCard');
  const today = new Date(); today.setHours(0,0,0,0);
  const castIds = updateTodayCast();

  const ddayExcludedTypes = new Set(['공식','SNS']);
  const upcoming = allEventsData
    .filter(e=>e.start && isTypeVisible(e.type) && !ddayExcludedTypes.has(e.type) && !castIds.has(e.id))
    .map(e=>({...e, dateObj:new Date(e.start)}))
    .filter(e=>!isNaN(e.dateObj) && e.dateObj>=today)
    .sort((a,b)=>a.dateObj-b.dateObj);

  if(upcoming.length===0){ card.style.display='none'; syncTopCards(); return; }

  const next = upcoming[0];
  const diffDays = Math.round((next.dateObj - today)/86400000);
  card.style.display='flex';
  document.getElementById('ddayNumber').textContent = diffDays===0 ? 'D-DAY' : `D-${diffDays}`;
  document.getElementById('ddayTitle').textContent = next.title;
  document.getElementById('ddayDate').textContent =
    `${next.dateObj.getMonth()+1}월 ${next.dateObj.getDate()}일`;
  document.getElementById('ddayDot').style.background = 'var(--accent)';
  document.getElementById('ddayNumber').style.color = 'var(--accent)';
  document.getElementById('ddayLabel').style.color = 'var(--accent)';
  syncTopCards();
}

const feedCategoryColor = { '영상':'#C81414', '사진':'#2F4FD8', '움짤':'#F0A227', '꿀잼':'#FF9EC4', '팬아트':'#1BC4E3', '라이브':'#BE5AEB', '메시지':'#24A43A', '기타':'#8A8A8A' };

// 선택된 범례가 없으면(기본) 모든 떡밥 표시, 선택하면 해당 범례의 떡밥만 표시
// '전체' 칩: 전체 표시 <-> 전체 숨김 토글 (hideAllFeed = 전체 숨김 상태)

const feedFilterRow = document.getElementById('feedFilterRow');
function renderFeedFilterChips(){
  const allActive = !hideAllFeed && (activeFeedTypes.size === 0 || activeFeedTypes.size === feedCategories.length);
  const allChip = `<div class="filter-chip all${allActive?' active':''}" data-all="1">전체</div>`;
  const chips = feedCategories.map(k=>{
    const isActive = activeFeedTypes.has(k);
    const color = feedCategoryColor[k];
    return `<div class="filter-chip${isActive?' active':''}" data-type="${k}" style="--chip-color:${color};">
      <span class="dot" style="background:${color}"></span>${k}
    </div>`;
  }).join('');

}
feedFilterRow.addEventListener('click', (e)=>{
  const chip = e.target.closest('.filter-chip');
  if(!chip) return;
  if(chip.dataset.all){
    // 전체: 이미 전체 표시 중이면 전체 숨김, 아니면 전체 표시로 되돌림
    const wasAllOn = !hideAllFeed && (activeFeedTypes.size === 0 || activeFeedTypes.size === feedCategories.length);
    hideAllFeed = wasAllOn;
    activeFeedTypes = new Set();

    hideAllFeed = false;
    const t = chip.dataset.type;
    if(activeFeedTypes.has(t)) activeFeedTypes.delete(t);
    else activeFeedTypes.add(t);

  renderFeedFilterChips();

  if(selectedFeedDate) renderFeedPanel(selectedFeedDate);
});

function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ============ 링크 → 임베드 (가능한 플랫폼만) ============
// 유튜브: 공식 iframe 임베드, API 키 없이 항상 동작.
// X(트위터): blockquote + widgets.js 공개 임베드, API 키 불필요하지만
//   비공개/삭제된 게시물이거나 X 쪽 사정으로 가끔 렌더링에 실패할 수 있음 → 그 경우 링크로 대체.
// 인스타그램/스레드: 2020~2026년 초까지는 메타가 oEmbed에 액세스 토큰+앱 심사를 요구해서
//   서버 없이는 임베드가 불가능했지만, 2026년 6월 15일부로 메타가 이 정책을 되돌려서
//   Instagram/Threads oEmbed가 다시 토큰 없이 동작함. 그래서 트위터와 동일한 방식
//   (blockquote + 공식 embed.js) 으로 클라이언트에서 바로 임베드 가능.
// 틱톡: 원래부터 API 키/토큰 없이 blockquote + embed.js로 항상 임베드 가능.
// 페이스북: 게시물/영상 모두 앱 등록 없이 공개 iframe(plugins/post.php, plugins/video.php)으로
//   임베드 가능하지만, 트위터/인스타처럼 높이를 자동으로 못 맞춰서 내용에 따라 살짝
//   잘리거나 여백이 남을 수 있음 (공식 SDK의 알려진 한계).
// 그 외(웨이보, 샤오홍슈/레드노트, 카카오톡, 네이버 등): 공개 client-side 임베드 위젯이
//   없어서(로그인 필요/비공개 API) 임베드가 불가능함 → 기존처럼 아이콘+링크로 대체.
function getLinkPlatform(link){
  if(!link) return null;
  if(/youtube\.com|youtu\.be/.test(link)) return 'youtube';
  if(/(^|\/\/)(www\.)?(twitter\.com|x\.com)\//.test(link)) return 'twitter';
  if(/(^|\/\/)(www\.)?instagram\.com\/(p|reel|tv)\//.test(link)) return 'instagram';
  if(/(^|\/\/)(www\.)?threads\.(net|com)\//.test(link)) return 'threads';
  if(/(^|\/\/)(www\.)?tiktok\.com\/@[^/]+\/video\//.test(link)) return 'tiktok';
  if(/(^|\/\/)(www\.)?facebook\.com\/[^/]+\/posts\//.test(link)) return 'facebook-post';
  if(/(^|\/\/)(www\.)?facebook\.com\/[^/]+\/videos\//.test(link)) return 'facebook-video';
  return null;
}

function getYoutubeEmbedId(link){
  const m = link.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

// 임베드 위젯마다 '이보다 좁으면 깨지는' 최소 폭이 있어서, 열이 그보다 좁으면
// 최소 폭으로 그린 뒤 zoom으로 통째로 줄여서 열 폭에 맞춘다.
// shrink: 세로가 긴 임베드는 넉넉한 곳에서도 살짝(0.85) 줄여서 스크롤 부담을 줄임.
function fitEmbed(minW, avail, shrink){
  avail = avail || minW;
  let z = shrink || 1;
  let w = Math.round(avail / z);
  if(w < minW){ w = minW; z = avail / minW; }
  return { w, z: Math.round(z * 1000) / 1000 };
}

function feedEmbedHTML(item, embedWidth){
  const platform = getLinkPlatform(item.link);
  if(platform === 'youtube'){
    const id = getYoutubeEmbedId(item.link);
    if(!id) return '';
    return `<div class="feed-embed feed-embed-yt">
      <iframe src="https://www.youtube.com/embed/${id}" title="YouTube video" loading="lazy"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>`;
  }
  if(platform === 'twitter'){
    // data-width를 카드의 실제 가용 너비로 못박아둬야, 트위터 위젯이 자체적으로
    // 재는 폭이 틀어져서(예: 처음 측정 시점이 안 맞는 경우) 카드 밖으로 삐져나오는 걸 막을 수 있음.
    const f = fitEmbed(250, embedWidth, 1);
    return `<div class="feed-embed feed-embed-tw" style="width:${f.w}px;max-width:none;zoom:${f.z};">
      <blockquote class="twitter-tweet" data-dnt="true" data-conversation="none" data-width="${f.w}">
        <a href="${item.link}"></a>
      </blockquote>
    </div>`;
  }
  if(platform === 'instagram'){
    const f = fitEmbed(326, embedWidth, .85);
    return `<div class="feed-embed feed-embed-ig" style="width:${f.w}px;max-width:none;zoom:${f.z};">
      <blockquote class="instagram-media" data-instgrm-permalink="${item.link}" data-instgrm-version="14" style="margin:0;width:100%;min-width:0;max-width:100%;"></blockquote>
    </div>`;
  }
  if(platform === 'threads'){
    const f = fitEmbed(300, embedWidth, .85);
    return `<div class="feed-embed feed-embed-th" style="width:${f.w}px;max-width:none;zoom:${f.z};">
      <blockquote class="text-post-media" data-text-post-permalink="${item.link}" data-text-post-version="0" style="margin:0;width:100%;min-width:0;max-width:100%;"></blockquote>
    </div>`;
  }
  if(platform === 'tiktok'){
    const idm = item.link.match(/\/video\/(\d+)/);
    if(!idm) return ''; // vm.tiktok.com 같은 단축 링크는 영상 ID를 못 뽑아서 링크 카드로 대체
    const f = fitEmbed(325, embedWidth, .85);
    return `<div class="feed-embed feed-embed-tt" style="width:${f.w}px;max-width:none;zoom:${f.z};">
      <blockquote class="tiktok-embed" cite="${item.link}" data-video-id="${idm[1]}" style="max-width:325px;min-width:325px;">
        <section></section>
      </blockquote>
    </div>`;
  }
  if(platform === 'facebook-post' || platform === 'facebook-video'){
    const isVideo = platform === 'facebook-video';
    const f = fitEmbed(220, embedWidth, .85);
    const w = Math.min(500, f.w);
    const h = isVideo ? Math.round(w*9/16) + 60 : 480;
    const href = encodeURIComponent(item.link);
    const kind = isVideo ? 'video' : 'post';
    return `<div class="feed-embed feed-embed-fb" style="width:${w}px;max-width:none;zoom:${f.z};">
      <iframe src="https://www.facebook.com/plugins/${kind}.php?href=${href}&width=${w}&show_text=false"
        width="${w}" height="${h}" style="border:none;overflow:hidden;" scrolling="no" frameborder="0"
        allowTransparency="true" ${isVideo?'allowFullScreen':''}></iframe>
    </div>`;
  }
  return '';
}


const feedCatOptionsHTML = sel => feedCategories.map(c=>
  `<option value="${c}" ${c===sel?'selected':''}>${c}</option>`
).join('');

function feedTimeLabel(ts){
  if(!ts) return '';
  const m = Math.floor((Date.now() - ts) / 60000);
  if(m < 1) return '방금';
  if(m < 60) return `${m}분`;
  const h = Math.floor(m / 60);
  if(h < 24) return `${h}시간`;
  const d = new Date(ts);
  return `${d.getMonth()+1}월 ${d.getDate()}일`;
}

    </div>
  </div>`;
}

const feedPanel = document.getElementById('feedPanel');

function renderFeedPanel(dateStr){
  selectedFeedDate = dateStr;
  const preselectEventId = pendingLinkEventId;
  pendingLinkEventId = null;
  const d = new Date(dateStr+'T00:00:00');
  const items = (feedByDate[dateStr]||[])
    .filter(i=>isFeedVisible(i.category))
    .slice().sort((a,b)=> (a.createdAt||0)-(b.createdAt||0));

  // 본문에서 실제로 임베드가 차지할 수 있는 폭(아바타 40 + 간격 12)을 열 폭 기준으로 계산해서
  // 위젯이 스스로 재는 값이 어긋나 밖으로 삐져나오지 않게 못박아둠. (최대 360px)
  // 화면이 넓으면(820px 이상) 2열이라 열 폭 기준, 아니면 1열.
  const panelWidth = feedPanel.clientWidth || 280;
  const cols = window.innerWidth >= 820 ? 2 : 1;
  const colWidth = (panelWidth - (cols - 1) * 28) / cols;
  const embedWidth = Math.max(100, Math.min(360, Math.floor(colWidth - 54)));

  const itemsHTML = items.length
    ? `<div class="feed-list">${items.map(item=>feedItemHTML(item, embedWidth)).join('')}</div>`
    : `<div class="feed-empty">아직 등록된 떡밥이 없어요.</div>`;

  feedPanel.innerHTML = `
    <div class="feed-panel-date">${d.getMonth()+1}월 ${d.getDate()}일</div>

function refreshFeedDots(){
  document.querySelectorAll('#feedCalendar .fc-daygrid-day').forEach(cell=>{
    const dateStr = cell.getAttribute('data-date');
    if(!dateStr) return;
    cell.classList.remove('feed-has-entry');
    const old = cell.querySelector('.feed-cal-dots');
    if(old) old.remove();
    const oldChips = cell.querySelector('.feed-chips');
    if(oldChips) oldChips.remove();
    const items = (feedByDate[dateStr]||[]).filter(i=>isFeedVisible(i.category));
    if(items && items.length){
      cell.classList.add('feed-has-entry');
      // 칸 안: 메모 목록 최대 5개 + 나머지는 +N개
      const maxShow = 5;
      const chipsWrap = document.createElement('div');
      chipsWrap.className = 'feed-chips';
      items.slice(0, maxShow).forEach(it=>{
        const chip = document.createElement('div');
        chip.className = 'feed-chip';
        const catColor = feedCategoryColor[it.category] || '#8A8A8A';
        if(it.link){
          // 링크가 있으면 플랫폼(X, 유튜브, 인스타 등)에 맞는 아이콘, 색은 카테고리 색
          chip.insertAdjacentHTML('beforeend', getLinkIcon(it.link, 'feed-chip-icon'));
          const ic = chip.lastElementChild;
          if(ic && ic.tagName === 'I') ic.style.color = catColor;
        } else {
          // 링크 없이 메모만 있으면 카테고리 색 점
          const cdot = document.createElement('span');
          cdot.className = 'feed-chip-dot';
          cdot.style.background = catColor;
          chip.appendChild(cdot);
        }
        const memoText = (it.memo||'').trim();
        // 메모가 있으면 메모 첫 줄, 없으면 카테고리 이름
        chip.appendChild(document.createTextNode(memoText ? memoText.split('\n')[0] : it.category));
        chip.title = memoText || it.category;
        chipsWrap.appendChild(chip);
      });
      if(items.length > maxShow){
        const more = document.createElement('span');
        more.className = 'feed-more';
        more.textContent = `+${items.length - maxShow}개`;
        chipsWrap.appendChild(more);
      }
      // 달력 탭의 일정처럼 '일정 영역' 안에 넣는다 → 비어 있는 칸은 달력 탭과 똑같은 높이,
      // 목록이 있는 칸은 목록 높이만큼만 차지해서 목록과 점 사이에 빈 영역이 따로 생기지 않음.
      const evBox = cell.querySelector('.fc-daygrid-day-events');
      const dayTop = cell.querySelector('.fc-daygrid-day-top');
      if(evBox) evBox.appendChild(chipsWrap);
      else if(dayTop) dayTop.insertAdjacentElement('afterend', chipsWrap);
      else (cell.querySelector('.fc-daygrid-day-frame') || cell).appendChild(chipsWrap);

      // 칸 맨 아래: 어떤 카테고리가 있는지 색 점으로 표시 (기존 그대로)
      const cats = [...new Set(items.map(i=>i.category))].slice(0, 6);
      const wrap = document.createElement('div');
      wrap.className = 'feed-cal-dots';
      wrap.title = items.map(i=>i.category).join(', ');
      cats.forEach(c=>{
        const dot = document.createElement('span');
        dot.className = 'fcd-dot';
        dot.style.background = feedCategoryColor[c] || '#8A8A8A';
        wrap.appendChild(dot);
      });
      (cell.querySelector('.fc-daygrid-day-frame') || cell).appendChild(wrap);
    }
  });
}

// ============ 달력 ↔ 떡밥 연동 ============
function escHTML(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function ymd(v){ return String(v||'').slice(0,10); }
function shortDate(v){
  const m = ymd(v).split('-');
  return m.length===3 ? `${+m[1]}/${+m[2]}` : '';
}

function openCalendarDate(dateStr){
  dateStr = ymd(dateStr);
  navSave();
  activateTab(document.querySelector('.tab-btn[data-tab="calendar"]'));
  calendar.updateSize();
  calendar.gotoDate(dateStr);
  navPush({ tab:'calendar', calDate: dateStr.slice(0,7)+'-01', scrollY:0 });
  setTimeout(()=>document.getElementById('calendar').scrollIntoView({behavior:'smooth', block:'start'}), 60);
}

// 떡밥 탭에서 특정 날짜를 선택해 패널을 보여줌 (이동/복원 공용)
function showFeedDate(dateStr, scroll){
  document.querySelectorAll('#feedCalendar .fc-daygrid-day.feed-selected').forEach(el=>el.classList.remove('feed-selected'));
  const cell = document.querySelector(`#feedCalendar .fc-daygrid-day[data-date="${dateStr}"]`);
  if(cell) cell.classList.add('feed-selected');
  editingFeedId = null;
  renderFeedPanel(dateStr);
  if(scroll) (cell || feedView).scrollIntoView({behavior:'smooth', block:'center'});
}

function openFeedDate(dateStr){
  dateStr = ymd(dateStr);
  navSave();
  activateTab(document.querySelector('.tab-btn[data-tab="feed"]'));
  feedCalendar.gotoDate(dateStr);
  navPush({ tab:'feed', feedDate: dateStr, feedMonth: dateStr.slice(0,7)+'-01', scrollY:0 });
  setTimeout(()=>showFeedDate(dateStr, true), 60);

// ---------- 뒤로가기(히스토리) ----------
// 탭 전환이나 '일정 → 연결된 떡밥' 같은 이동을 히스토리에 쌓아서,
// 폰/브라우저의 뒤로가기를 눌렀을 때 홈으로 나가지 않고 직전 화면(탭, 달, 선택한 날짜, 스크롤)으로 돌아오게 함.
let navRestoring = false;

function dateToYmd(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function captureNavState(){
  const active = document.querySelector('.tab-btn.active');
  const st = { tab: active ? active.dataset.tab : 'calendar', scrollY: window.scrollY, feedDate: selectedFeedDate || null };
  try{ st.calDate = dateToYmd(calendar.view.currentStart); }catch(e){}
  try{ st.feedMonth = dateToYmd(feedCalendar.view.currentStart); }catch(e){}
  return st;
}
function navSave(){
  if(navRestoring) return;
  try{ history.replaceState(captureNavState(), ''); }catch(e){}
}
function navPush(state){
  if(navRestoring) return;
  try{ history.pushState(state, ''); }catch(e){}
}

function applyNavState(st){
  navRestoring = true;
  const btn = document.querySelector(`.tab-btn[data-tab="${st.tab}"]`);
  if(btn) activateTab(btn);
  if(st.tab === 'calendar'){
    calendar.updateSize();
    if(st.calDate) calendar.gotoDate(st.calDate);
  } else {
    feedCalendar.updateSize();
    if(st.feedMonth) feedCalendar.gotoDate(st.feedMonth);
    if(st.feedDate) setTimeout(()=>showFeedDate(st.feedDate, false), 60);
  }
  setTimeout(()=>{ window.scrollTo(0, st.scrollY || 0); navRestoring = false; }, 160);
}

try{ history.scrollRestoration = 'manual'; history.replaceState({ tab:'calendar', scrollY:0 }, ''); }catch(e){}
window.addEventListener('popstate', (e)=>{
  if(e.state && e.state.tab) applyNavState(e.state);
});

// 떡밥을 연결할 수 있는 일정 목록: 해당 날짜 기준 앞뒤 3일 이내 (현재 연결된 일정은 항상 포함)
function eventSelectHTML(id, dateStr, selectedId){
  const base = new Date(ymd(dateStr)+'T00:00:00').getTime();
  if(isNaN(base)) return '';
  const DAY = 86400000;
  const list = allEventsData
    .filter(e=>e.start)
    .map(e=>({ e, diff: Math.abs(new Date(ymd(e.start)+'T00:00:00').getTime() - base) }))
    .filter(x=>x.e.id===selectedId || (!isNaN(x.diff) && x.diff <= 3*DAY))
    .sort((a,b)=>ymd(a.e.start).localeCompare(ymd(b.e.start)) || String(a.e.title).localeCompare(String(b.e.title)));
  if(!list.length) return '';
  const opts = list.map(({e})=>{
    const label = shortDate(e.start) + ' ' + (e.title||'');   // 같은 날짜 일정도 항상 날짜를 붙임
    return `<option value="${escHTML(e.id)}"${e.id===selectedId?' selected':''}>${escHTML(label)}</option>`;
  }).join('');
  return `<select id="${id}"><option value="">연결할 일정 (선택)</option>${opts}</select>`;
}

const eventFeedModal = document.getElementById('eventFeedModal');
const efmList = document.getElementById('efmList');
let archiveEventId = null;
eventFeedModal.querySelector('.close-btn').onclick = ()=> eventFeedModal.classList.remove('show');

// 일정에 연결된 떡밥 보러 가기.
// 떡밥은 일정 날짜와 다른 날에 등록됐을 수 있으므로(예: 해외 일정 시차), 일정 날짜가 아니라
// '연결된 떡밥이 실제로 등록된 날짜'로 이동한다. 떡밥이 여러 날에 흩어져 있으면 모아보기 창에서 고른다.
function openEventFeed(eventId){
  const items = feedByEvent[eventId] || [];
  if(!items.length) return;
  const dates = [...new Set(items.map(i=>i.date))].sort();
  if(dates.length === 1) openFeedDate(dates[0]);
  else openEventArchive(eventId);
}

function openEventArchive(eventId){
  const ev = allEventsData.find(e=>e.id===eventId);
  if(!ev) return;
  archiveEventId = eventId;
  const items = (feedByEvent[eventId]||[]).slice()
    .sort((a,b)=> String(a.date).localeCompare(String(b.date)) || (a.createdAt||0)-(b.createdAt||0));
  document.getElementById('efmTitle').textContent = ev.title || '';
  document.getElementById('efmSub').textContent =
    `${shortDate(ev.start)} · ${ev.type||'일정'} · 연결된 떡밥 ${items.length}개`;
  efmList.innerHTML = items.length ? items.map(it=>{
    const color = feedCategoryColor[it.category] || '#8A8A8A';
    const memo = (it.memo||'').trim();
    const icon = it.link ? getLinkIcon(it.link, 'feed-item-icon') : '';
    return `<div class="efm-item${it.link?' clickable':''}" data-link="${escHTML(it.link||'')}" style="border-left-color:${color};background:${hexToRgba(color,0.09)};">
      <div class="efm-top">
        <span class="efm-cat">${icon}${escHTML(it.category)}</span>
        <span class="efm-goto" data-date="${escHTML(it.date)}">${shortDate(it.date)} <i class="fa-solid fa-chevron-right"></i></span>
      </div>
      ${memo ? `<div class="efm-memo">${escHTML(memo)}</div>` : ''}
    </div>`;
  }).join('') : `<div class="feed-empty">아직 연결된 떡밥이 없어요.</div>`;
  eventFeedModal.classList.add('show');
}

efmList.addEventListener('click', (e)=>{
  const go = e.target.closest('.efm-goto');
  if(go){
    eventFeedModal.classList.remove('show');
    openFeedDate(go.dataset.date);
    return;
  }
  const item = e.target.closest('.efm-item.clickable');
  if(item && item.dataset.link) window.open(item.dataset.link, '_blank');
});

document.getElementById('efmAddBtn').onclick = ()=>{
  const ev = allEventsData.find(e=>e.id===archiveEventId);

  eventFeedModal.classList.remove('show');
  pendingLinkEventId = ev.id;

};

let overlayRaf = 0;
function scheduleOverlayRefresh(){
  if(overlayRaf) return;
  overlayRaf = requestAnimationFrame(()=>{ overlayRaf = 0; refreshScheduleFeedDots(); });
}

function refreshScheduleFeedDots(){
  document.querySelectorAll('#calendar .sched-feed-dots').forEach(el=>el.remove());
  if(!feedOverlayOn) return;
  document.querySelectorAll('#calendar .fc-daygrid-day').forEach(cell=>{
    const dateStr = cell.getAttribute('data-date');
    if(!dateStr) return;
    const items = feedByDate[dateStr];
    if(!items || !items.length) return;
    const cats = [...new Set(items.map(i=>i.category))].slice(0, 6);
    const wrap = document.createElement('div');
    wrap.className = 'sched-feed-dots';
    wrap.dataset.date = dateStr;
    wrap.title = `떡밥 ${items.length}개 · 누르면 떡밥 탭으로 이동`;
    wrap.innerHTML = `<i class="fa-solid fa-camera-retro"></i>` +
      `<span class="sfd-dots">` +
      cats.map(c=>`<span class="sfd-dot" style="background:${feedCategoryColor[c]||'#8A8A8A'}"></span>`).join('') +
      `</span><span class="sfd-count">${items.length}</span>`;
    (cell.querySelector('.fc-daygrid-day-frame') || cell).appendChild(wrap);
  });

// (연결된 떡밥 배지는 더 이상 별도 클릭 영역이 아니라, calendar.on('eventClick')에서

// ---------- 통합 검색 (일정 + 떡밥) ----------
function feedMatches(item, q){
  const ev = item.eventId ? allEventsData.find(e=>e.id===item.eventId) : null;
  return [item.memo, item.link, item.category, ev && ev.title]
    .some(v=> String(v||'').toLowerCase().includes(q));
}

function renderSearchResults(){
  const box = document.getElementById('searchResults');
  const q = searchInput.value.trim().toLowerCase();
  if(!q){ box.style.display='none'; box.innerHTML=''; return; }

  const evs = allEventsData
    .filter(e=>e.start && isTypeVisible(e.type) && (e.title||'').toLowerCase().includes(q))
    .sort((a,b)=> ymd(b.start).localeCompare(ymd(a.start)));
  const fds = feedData
    .filter(f=>feedMatches(f, q))
    .sort((a,b)=> String(b.date).localeCompare(String(a.date)) || (b.createdAt||0)-(a.createdAt||0));

  const MAX = 30;
  const evRows = evs.slice(0, MAX).map(e=>{
    const color = eventColorHex[e.type] || '#D9D5CE';
    return `<div class="sr-row" data-kind="event" data-date="${escHTML(ymd(e.start))}">
      <span class="sr-dot" style="background:${color}"></span>
      <span class="sr-date">${shortDate(e.start)}</span>
      <span class="sr-main">${escHTML(e.title)}</span>
      <span class="sr-tag">${escHTML(e.type||'')}</span>
    </div>`;
  }).join('');
  const fdRows = fds.slice(0, MAX).map(f=>{
    const color = feedCategoryColor[f.category] || '#8A8A8A';
    const memo = (f.memo||'').trim().split('\n')[0];
    const text = memo || f.link || f.category;
    return `<div class="sr-row" data-kind="feed" data-date="${escHTML(f.date)}">
      <span class="sr-dot" style="background:${color}"></span>
      <span class="sr-date">${shortDate(f.date)}</span>
      <span class="sr-main">${escHTML(text)}</span>
      <span class="sr-tag">${escHTML(f.category)}</span>
    </div>`;
  }).join('');

  let html = '';
  if(evs.length) html += `<div class="sr-head">일정 <b>${evs.length}</b></div>${evRows}` +
    (evs.length>MAX ? `<div class="sr-more">외 ${evs.length-MAX}개 더 있어요</div>` : '');
  if(fds.length) html += `<div class="sr-head">떡밥 <b>${fds.length}</b></div>${fdRows}` +
    (fds.length>MAX ? `<div class="sr-more">외 ${fds.length-MAX}개 더 있어요</div>` : '');
  if(!html) html = `<div class="sr-empty">검색 결과가 없어요.</div>`;
  box.innerHTML = html;
  box.style.display = 'block';
}

document.getElementById('searchResults').addEventListener('click', (e)=>{
  const row = e.target.closest('.sr-row');
  if(!row) return;
  if(row.dataset.kind === 'feed') openFeedDate(row.dataset.date);
  else openCalendarDate(row.dataset.date);
});

// ---------- 월간 요약 ----------
function countBy(list, keyFn){
  const m = {};
  list.forEach(x=>{ const k = keyFn(x); m[k] = (m[k]||0) + 1; });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}

function breakdownHTML(title, entries, colorOf){
  if(!entries.length) return '';
  const segs = entries.map(([k,n])=>
    `<span class="ms-seg" style="flex:${n};background:${colorOf(k)}" title="${escHTML(k)} ${n}"></span>`).join('');
  const chips = entries.map(([k,n])=>
    `<span class="ms-chip"><span class="dot" style="background:${colorOf(k)}"></span>${escHTML(k)} ${n}</span>`).join('');
  return `<div class="ms-block">
    <div class="ms-block-title">${title}</div>
    <div class="ms-bar">${segs}</div>
    <div class="ms-chips">${chips}</div>
  </div>`;
}

function renderMonthSummary(){
  const box = document.getElementById('monthSummary');
  if(!box) return;
  let cs = null;
  try{ cs = calendar.view && calendar.view.currentStart; }catch(e){}
  if(!cs) return;
  const y = cs.getFullYear(), m = cs.getMonth() + 1;
  const key = `${y}-${String(m).padStart(2,'0')}`;

  const evs = allEventsData.filter(e=>ymd(e.start).slice(0,7) === key);
  const fds = feedData.filter(f=>String(f.date||'').slice(0,7) === key);
  const head = `<div class="ms-head"><span class="ms-title">${m}월 요약</span><span class="ms-year">${y}</span></div>`;

  if(!evs.length && !fds.length){
    box.innerHTML = head + `<div class="ms-empty">이 달은 아직 기록이 없어요.</div>`;
    return;
  }

  const recorded = evs.filter(e=>(feedByEvent[e.id]||[]).length > 0).length;
  const perDay = {};
  fds.forEach(f=>{ perDay[f.date] = (perDay[f.date]||0) + 1; });
  let bestDate = null, bestN = 0;
  Object.keys(perDay).sort().forEach(d=>{ if(perDay[d] > bestN){ bestN = perDay[d]; bestDate = d; } });

  const tiles = `<div class="ms-tiles">
    <div class="ms-tile"><div class="ms-num">${evs.length}</div><div class="ms-lab">일정</div></div>
    <div class="ms-tile"><div class="ms-num">${fds.length}</div><div class="ms-lab">떡밥</div></div>
    <div class="ms-tile"><div class="ms-num">${evs.length ? `${recorded}/${evs.length}` : '–'}</div><div class="ms-lab">떡밥을 연결한 일정</div></div>
    ${bestDate
      ? `<div class="ms-tile clickable" data-date="${bestDate}"><div class="ms-num">${shortDate(bestDate)}</div><div class="ms-lab">떡밥이 가장 많은 날 · ${bestN}개</div></div>`
      : `<div class="ms-tile"><div class="ms-num">–</div><div class="ms-lab">떡밥이 가장 많은 날</div></div>`}
  </div>`;

  box.innerHTML = head + tiles +
    breakdownHTML('일정 종류', countBy(evs, e=>e.type||'기타'), k=>eventColorHex[k] || '#D9D5CE') +
    breakdownHTML('떡밥 카테고리', countBy(fds, f=>f.category||'기타'), k=>feedCategoryColor[k] || '#8A8A8A');
}

document.getElementById('monthSummary').addEventListener('click', (e)=>{
  const tile = e.target.closest('.ms-tile.clickable');
  if(tile) openFeedDate(tile.dataset.date);
});

feedUiReady = true;

(async()=>{
  feedData = await loadCollection('feed');
  // 기존 카테고리명으로 저장된 데이터를 새 카테고리명으로 마이그레이션
  const categoryMigrations = { '기사':'팬아트', '직캠':'영상', '직찍':'사진' };
  const legacyItems = feedData.filter(f => categoryMigrations[f.category]);
  if(legacyItems.length){
    await Promise.all(legacyItems.map(item =>
      db.collection('feed').doc(item.id).update({ category: categoryMigrations[item.category] })
    ));
    feedData = feedData.map(f => categoryMigrations[f.category] ? { ...f, category: categoryMigrations[f.category] } : f);
  }
  rebuildFeedByDate();
  refreshFeedDots();
  refreshCalendarEvents();
})();

</script>
