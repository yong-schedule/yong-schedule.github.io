<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Solar Schedule</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* ============ 디자인 토큰 ============ */
:root{
  --page-bg:#EEEDF3;
  --surface:#FFFFFF;
  --ink:#221F1C;
  --ink-soft:#8B8580;
  --ink-faint:#C2BDB6;
  --line:#EAE7E1;
  --line-strong:#DEDAD2;

  --accent:#6C5CE7;
  --accent-soft:#EDEAFB;

  --danger:#E8556B;
  --danger-soft:#FCE3E7;

  --c-official:#F0554B;
  --c-musical:#DB9A2E;
  --c-broadcast:#3E8FD9;
  --c-sns:#8B7AE8;
  --c-solardo:#F0578F;
  --c-celebrate:#F08A3C;
  --c-release:#2FAE7C;
  --c-etc:#9C9488;

  --radius-xl:28px;
  --radius-lg:16px;
  --radius-md:12px;
  --radius-sm:9px;
  --shadow-card:0 24px 60px rgba(30,24,15,.08);
  --shadow-soft:0 4px 14px rgba(30,24,15,.05);
  --shadow-pop:0 16px 40px rgba(30,24,15,.18);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-x:hidden;}
body{
  font-family:'Pretendard Variable','Pretendard', system-ui, sans-serif;
  background:var(--page-bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

.page-outer{
  max-width:960px;
  margin:0 auto;
  padding:14px 18px 80px;
  overflow-x:hidden;
}

/* ============ 카드 ============ */
.app-card{
  background:var(--surface);
  border-radius:var(--radius-xl);
  box-shadow:var(--shadow-card);
  padding:30px 30px 22px;
}

/* ============ 헤더 ============ */
.app-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  margin-bottom:22px;
}
.wordmark{
  margin:0;
  font-weight:800;
  font-size:26px;
  letter-spacing:-0.02em;
  color:var(--ink);
}
.wordmark-thin{
  font-weight:500;
  color:var(--ink-soft);
}
.wordmark-caption{
  margin:4px 0 0;
  font-size:12.5px;
  color:var(--ink-faint);
  font-weight:600;
}

/* ============ D-day 스트립 ============ */
.dday-strip{
  display:flex;
  align-items:center;
  gap:14px;
  background:var(--accent-soft);
  border-radius:var(--radius-lg);
  padding:12px 18px;
  margin-bottom:18px;
}
.dday-number{
  font-weight:800;
  font-size:20px;
  color:var(--accent);
  min-width:52px;
}
.dday-divider{
  width:1px;
  align-self:stretch;
  background:rgba(108,92,231,.18);
}
.dday-body{display:flex;flex-direction:column;gap:2px;min-width:0;}
.dday-label{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;opacity:.75;}
.dday-title-row{display:flex;align-items:center;gap:7px;min-width:0;}
.dday-dot{width:6px;height:6px;border-radius:50%;flex:none;}
.dday-title{font-size:13.5px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dday-date{font-size:11.5px;color:var(--ink-soft);}

/* ============ 툴바 ============ */
.toolbar-row{
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:10px;
  margin-bottom:18px;
  width:100%;
  min-width:0;
}
.filter-row{
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
  width:100%;
  max-width:100%;
  min-width:0;
}
.filter-row::-webkit-scrollbar{display:none;}
.filter-chip{
  flex:none;
  display:flex;
  align-items:center;
  gap:4px;
  padding:5px 10px;
  border-radius:999px;
  border:1px solid var(--line-strong);
  background:var(--surface);
  font-size:10.5px;
  font-weight:600;
  color:var(--ink-soft);
  cursor:pointer;
  user-select:none;
  transition:all .15s ease;
  white-space:nowrap;
}
.filter-chip .dot{width:5px;height:5px;border-radius:50%;flex:none;}
.filter-chip.active{color:#fff;border-color:transparent;}
.filter-chip.all{font-weight:700;}
.filter-chip.all.active{background:var(--ink);color:#fff;}

.search-box{
  position:relative;
  display:flex;
  align-items:center;
  flex:none;
  width:100%;
}
.search-box i{position:absolute;left:13px;font-size:12px;color:var(--ink-faint);}
.search-box input{
  width:100%;
  padding:9px 12px 9px 32px;
  border:1px solid var(--line-strong);
  border-radius:999px;
  background:var(--surface);
  font-family:inherit;
  font-size:12.5px;
  color:var(--ink);
}
.search-box input:focus{border-color:var(--accent);}
.search-box input::placeholder{color:var(--ink-faint);}

/* ============ 아바타 스택 (사진 버전용) ============ */
.avatar-stack{display:flex;align-items:center;flex:none;}
.avatar-stack img{
  width:34px;height:34px;border-radius:50%;
  object-fit:cover;
  border:2.5px solid var(--surface);
  box-shadow:0 2px 6px rgba(30,24,15,.12);
  margin-left:-10px;
}
.avatar-stack img:first-child{margin-left:0;}

/* ============ 달력 ============ */
.calendar-wrap{overflow-y:auto;-ms-overflow-style:none;scrollbar-width:none;}
.calendar-wrap::-webkit-scrollbar{width:0;background:transparent;}
#calendar{padding:0;}

.fc{font-family:'Pretendard Variable','Pretendard',system-ui,sans-serif;}
.fc-event{border:none!important;box-shadow:none!important;border-radius:6px!important;}
.fc .fc-toolbar-title{
  font-weight:800;
  font-size:16.5px;
  letter-spacing:-0.01em;
  color:var(--ink);
}
.fc .fc-button{
  font-family:inherit;
  font-size:11.5px;
  font-weight:700;
  padding:6px 12px;
  background:var(--surface);
  color:var(--ink);
  border:1px solid var(--line-strong);
  border-radius:999px;
}
.fc .fc-button:focus,.fc .fc-button:active{background:var(--surface);}
.fc .fc-button:hover{background:#F5F4F1;}
.fc .fc-customAddBtn-button{background:var(--ink)!important;color:#fff!important;border-color:var(--ink)!important;}
.fc .fc-customAddBtn-button:hover{filter:brightness(1.2);}
.fc .fc-modifyBtn-button{background:var(--surface)!important;color:var(--ink)!important;}
.fc .fc-today-button{color:var(--danger)!important;border-color:var(--danger-soft)!important;background:var(--danger-soft)!important;}
.fc-daygrid-day-number{font-size:10.5px;color:var(--ink-soft);font-weight:600;}
.fc-col-header-cell-cushion{
  font-size:10.5px;
  color:var(--ink-faint);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.06em;
  padding:8px 0;
}
.fc-theme-standard td, .fc-theme-standard th{border-color:var(--line)!important;}
.fc .fc-daygrid-day.fc-day-today{background:var(--accent-soft)!important;}
.fc-daygrid-day-frame{padding:2px;}
.fc-daygrid-day{cursor:pointer;}

*:focus{outline:none!important;box-shadow:none!important;}
.fc *:focus{outline:none!important;box-shadow:none!important;}

.event-icon{width:1em;height:1em;object-fit:contain;vertical-align:middle;margin-left:2px;}
.event-icon.bstage{width:calc(1em + 1pt);height:calc(1em + 1pt);}

/* ============ 모달 ============ */
.modal{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  background:var(--surface);
  padding:22px 22px 20px;
  border-radius:var(--radius-xl);
  width:340px;
  max-width:90%;
  max-height:82%;
  overflow-y:auto;
  display:none;
  z-index:9999;
  box-shadow:var(--shadow-pop);
}
.modal.show{display:block;}
.modal h3{
  font-weight:800;
  font-size:17px;
  letter-spacing:-0.01em;
  margin:0 0 16px;
  color:var(--ink);
}
.modal .close-btn{
  position:absolute;top:14px;right:14px;
  border:none;background:none;font-size:16px;cursor:pointer;color:var(--ink-faint);
}
.field-label{
  font-size:11px;
  font-weight:700;
  letter-spacing:.06em;
  color:var(--ink-faint);
  text-transform:uppercase;
  margin:12px 0 4px;
  display:block;
}
.modal input,.modal select,.modal textarea{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--line-strong);
  border-radius:var(--radius-sm);
  font-family:inherit;
  font-size:13px;
  color:var(--ink);
  background:var(--surface);
}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--accent);}
.modal textarea{resize:vertical;}

.modal-actions{display:flex;gap:8px;margin-top:20px;}
.btn{
  flex:1;
  padding:11px;
  border:none;
  border-radius:999px;
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}
.btn-primary{background:var(--ink);color:#fff;}
.btn-primary:hover{background:#3A362F;}
.btn-danger{background:var(--danger-soft);color:var(--danger);}
.btn-danger:hover{background:var(--danger);color:#fff;}

/* ============ 메모 보기 모달 ============ */
.memo-title{
  font-size:13px;
  font-weight:700;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--accent);
  text-transform:uppercase;
  letter-spacing:.08em;
}
#memoViewContent{font-size:13px;line-height:1.7;color:var(--ink);}

/* ============ 범례 ============ */
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:6px 12px;
  justify-content:center;
  margin:18px 0 0;
}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ink-soft);}
.legend-item .dot{width:7px;height:7px;border-radius:50%;flex:none;}

footer.site-footer{
  text-align:center;
  margin-top:22px;
  font-size:10px;
  letter-spacing:.14em;
  color:var(--ink-faint);
  text-transform:uppercase;
}

/* ============ 반응형 ============ */
@media(max-width:600px){
  .page-outer{padding:10px 10px 70px;}
  .app-card{padding:20px 16px 16px;border-radius:22px;}
  .wordmark{font-size:21px;}
  .dday-strip{padding:10px 14px;gap:10px;}
  .dday-number{font-size:17px;min-width:40px;}
  .fc-daygrid-day-number{font-size:9px!important;}
  .fc .fc-toolbar-title{font-size:14px;}
  .fc .fc-button{font-size:10px;padding:4px 9px;}
  .fc-col-header-cell-cushion{font-size:9px;}
  .avatar-stack img{width:28px;height:28px;}
  .modal input,.modal select,.modal textarea{font-size:16px;}
  .search-box input{font-size:16px;}
  .fc-daygrid-event-harness{margin-bottom:1px!important;}
  .fc-event{display:block!important;}
  .legend{
    flex-wrap:nowrap;
    gap:0 6px;
    margin:14px 0 0;
    overflow-x:auto;
  }
  .legend-item{font-size:8px;gap:2px;white-space:nowrap;}
  .legend-item .dot{width:5px;height:5px;}
}

/* ============ 탭 바 (달력 / 떡밥) ============ */
.tab-bar{
  display:flex;
  justify-content:center;
  gap:8px;
  max-width:960px;
  margin:0 auto;
  padding:18px 18px 0;
}
.tab-btn{
  flex:none;
  display:flex;
  align-items:center;
  gap:7px;
  padding:10px 18px;
  border-radius:999px;
  border:1px solid var(--line-strong);
  background:var(--surface);
  color:var(--ink-soft);
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  box-shadow:var(--shadow-soft);
}
.tab-btn i{font-size:14px;}
.tab-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}

/* ============ 떡밥 탭: 미니 달력 ============ */
.feed-shell{
  display:flex;
  gap:18px;
  align-items:flex-start;
}
.feed-calendar-col{flex:1 1 0;min-width:0;}
.feed-panel-col{flex:none;width:280px;}

#feedCalendar .fc-event{display:none!important;}
.feed-dots{display:flex;flex-direction:column;align-items:flex-start;gap:1px;justify-content:flex-start;padding:0 4px;margin-top:1px;}
.feed-dots-row{display:grid;grid-template-columns:repeat(3,6px);gap:3px;}
.feed-dots .feed-count{font-size:8.5px;font-weight:700;color:var(--ink-soft);margin-left:0;line-height:1;}
.feed-dot{
  width:6px;height:6px;border-radius:50%;
  flex:none;
}
.fc-daygrid-day.feed-has-entry{cursor:pointer;}
.fc-daygrid-day.feed-selected{background:var(--accent-soft)!important;}

/* ============ 떡밥 탭: 오른쪽(또는 하단) 패널 ============ */
.feed-panel{
  background:var(--surface);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-soft);
  padding:16px;
}
.feed-panel-date{
  font-weight:800;
  font-size:14.5px;
  color:var(--ink);
  margin:0 0 2px;
}
.feed-panel-sub{
  font-size:11px;
  color:var(--ink-faint);
  margin:0 0 14px;
}
.feed-item{
  display:flex;
  align-items:flex-start;
  gap:9px;
  padding:10px 10px 10px 12px;
  margin:8px 0 0;
  border-left:3px solid transparent;
  border-radius:8px;
}
.feed-item:first-of-type{margin-top:0;}
.feed-item .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px;}
.feed-item-body{flex:1;min-width:0;}
.feed-item-cat{font-size:11.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;}
.feed-item-icon{font-size:11px;color:var(--ink-soft);margin-right:5px;width:1em;height:1em;object-fit:contain;}
.feed-item-memo{font-size:12px;color:var(--ink-soft);margin-top:2px;word-break:break-word;}
.feed-item-clickable{cursor:pointer;transition:filter .15s ease;}
.feed-item-clickable:hover{filter:brightness(0.97);}
.feed-item-clickable:active{filter:brightness(0.93);}
.feed-item-actions{display:flex;gap:10px;flex:none;}
.feed-item-actions i{font-size:12px;color:var(--ink-faint);cursor:pointer;}
.feed-item-actions .fa-trash:hover{color:var(--danger);}
.feed-item-actions .fa-pen:hover{color:var(--accent);}
.feed-empty{font-size:12px;color:var(--ink-faint);padding:8px 0 14px;}

.feed-add-form{margin-top:6px;border-top:1px solid var(--line);padding-top:12px;}
.feed-add-form select,.feed-add-form input,.feed-add-form textarea{
  width:100%;
  padding:8px 10px;
  border:1px solid var(--line-strong);
  border-radius:var(--radius-sm);
  font-family:inherit;
  font-size:12.5px;
  color:var(--ink);
  background:var(--surface);
  margin-bottom:7px;
}
.feed-add-form textarea{resize:vertical;}
.feed-add-btn{
  width:100%;
  padding:9px;
  border:none;
  border-radius:999px;
  background:var(--ink);
  color:#fff;
  font-family:inherit;
  font-size:12.5px;
  font-weight:700;
  cursor:pointer;
}
.feed-add-btn:hover{background:#3A362F;}
.feed-panel-placeholder{font-size:12.5px;color:var(--ink-faint);text-align:center;padding:26px 0;}

/* ============ 떡밥 아이템 수정 폼 ============ */
.feed-item-editing{flex-direction:column;align-items:stretch;background:var(--page-bg)!important;}
.feed-item-editing select,.feed-item-editing input,.feed-item-editing textarea{
  width:100%;
  padding:8px 10px;
  border:1px solid var(--line-strong);
  border-radius:var(--radius-sm);
  font-family:inherit;
  font-size:12.5px;
  color:var(--ink);
  background:var(--surface);
  margin-bottom:7px;
}
.feed-item-editing textarea{resize:vertical;}
.feed-edit-actions{display:flex;gap:8px;}
.feed-save-btn,.feed-cancel-btn{
  flex:1;
  padding:8px;
  border-radius:999px;
  font-family:inherit;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}
.feed-save-btn{border:none;background:var(--ink);color:#fff;}
.feed-save-btn:hover{background:#3A362F;}
.feed-cancel-btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);}
.feed-cancel-btn:hover{background:#F5F4F1;}

/* ============ 알쓸용잡 탭 ============ */
.wiki-add-card{
  background:var(--surface);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-soft);
  padding:16px;
  margin-bottom:18px;
}
.wiki-add-card textarea{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--line-strong);
  border-radius:var(--radius-sm);
  font-family:inherit;
  font-size:13px;
  color:var(--ink);
  background:var(--surface);
  resize:vertical;
  margin-bottom:8px;
}
.wiki-add-btn{
  width:100%;
  padding:10px;
  border:none;
  border-radius:999px;
  background:var(--ink);
  color:#fff;
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}
.wiki-add-btn:hover{background:#3A362F;}

.wiki-list{display:flex;flex-direction:column;gap:10px;}
.wiki-item{
  display:flex;
  align-items:flex-start;
  gap:12px;
  background:var(--surface);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-soft);
  padding:14px 16px;
}
.wiki-num{
  flex:none;
  width:26px;
  height:26px;
  border-radius:50%;
  background:var(--accent-soft);
  color:var(--accent);
  font-weight:800;
  font-size:12.5px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.wiki-body{
  flex:1;
  min-width:0;
  font-size:13.5px;
  line-height:1.55;
  color:var(--ink);
  white-space:pre-wrap;
  word-break:break-word;
  padding-top:3px;
}
.wiki-actions{display:flex;gap:10px;flex:none;padding-top:5px;}
.wiki-actions i{font-size:12px;color:var(--ink-faint);cursor:pointer;}
.wiki-actions .fa-trash:hover{color:var(--danger);}
.wiki-actions .fa-pen:hover{color:var(--accent);}
.wiki-empty{font-size:12.5px;color:var(--ink-faint);text-align:center;padding:26px 0;}

.wiki-item-editing{flex-direction:column;align-items:stretch;background:var(--page-bg);box-shadow:none;}
.wiki-item-editing textarea{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--line-strong);
  border-radius:var(--radius-sm);
  font-family:inherit;
  font-size:13px;
  color:var(--ink);
  background:var(--surface);
  resize:vertical;
  margin-bottom:8px;
}
.wiki-edit-actions{display:flex;gap:8px;}
.wiki-save-btn,.wiki-cancel-btn{
  flex:1;
  padding:8px;
  border-radius:999px;
  font-family:inherit;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}
.wiki-save-btn{border:none;background:var(--ink);color:#fff;}
.wiki-save-btn:hover{background:#3A362F;}
.wiki-cancel-btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);}
.wiki-cancel-btn:hover{background:#F5F4F1;}

@media(max-width:600px){
  .feed-shell{flex-direction:column;}
  .feed-panel-col{width:100%;}
  .tab-bar{padding:14px 10px 0;}
  .feed-add-form select,.feed-add-form input,.feed-add-form textarea{font-size:16px;}
  .wiki-add-card textarea,.wiki-item-editing textarea{font-size:16px;}
}
</style>
</head>
<body>
<div class="tab-bar">
  <button class="tab-btn active" data-tab="calendar"><i class="fa-solid fa-calendar-days"></i> 달력</button>
  <button class="tab-btn" data-tab="feed"><i class="fa-solid fa-camera-retro"></i> 떡밥</button>
  <button class="tab-btn" data-tab="wiki"><i class="fa-solid fa-book-open"></i> 알쓸용잡</button>
</div>
<div id="calendarView">
<div class="page-outer">
  <div class="app-card">

    <div class="app-header">
      <div>
        <h1 class="wordmark">Solar <span class="wordmark-thin">Schedule</span></h1>
        <p class="wordmark-caption">마마무 솔라 캘린더</p>
      </div>
    </div>

    <div id="ddayCard" class="dday-strip" style="display:none;">

// ============ 링크 → 아이콘 매핑 (일정 / 떡밥 공용) ============
function getLinkIcon(link, iconClass){
  iconClass = iconClass || 'event-icon';
  if(!link) return '';
  if(link.includes('instagram')) return `<i class="fab fa-instagram ${iconClass}"></i>`;
  else if(link.includes('youtube.com') || link.includes('youtu.be')) return `<i class="fab fa-youtube ${iconClass}"></i>`;
  else if(link.includes('facebook')) return `<i class="fab fa-facebook ${iconClass}"></i>`;
  else if(link.includes('tiktok')) return `<i class="fab fa-tiktok ${iconClass}"></i>`;
  else if(link.includes('threads')) return `<i class="fab fa-threads ${iconClass}"></i>`;
  else if(link.includes('kakaotalk')) return `<i class="fab fa-kakaotalk ${iconClass}"></i>`;
  else if(link.includes('naver')) return `<i class="fab fa-naver ${iconClass}"></i>`;
  else if(link.includes('github')) return `<i class="fab fa-github ${iconClass}"></i>`;
  else if(link.includes('twitter.com') || link.includes('x.com')) return `<i class="fab fa-x-twitter ${iconClass}"></i>`;
  else if(link.includes('bstage') || link.includes('https://solarkeem.com'))
    return `<img src="https://i.namu.wiki/i/-BYbNrH2E_lYZNZnTZ7oJu1CdynHFQs8OczMZ4Qd2Jm2oGAgWJPTjoOi6LTBZnWumb_KFv7GSJhtp9B69w1fXA.svg" class="${iconClass} bstage">`;
  else return `<i class="fas fa-link ${iconClass}"></i>`;
}

// ============ 색상 정의 ============
const eventColorHex = {
  '공식':'#F0554B','방송':'#3E8FD9','SNS':'#8B7AE8','솔라시도':'#F0578F',
  '뮤지컬':'#DB9A2E','콘서트':'#F08A3C','발매':'#1FA6A6','축하':'#2FAE7C','기타':'#9C9488'
};

const legendTypes = Object.keys(eventColorHex);

document.getElementById('legend').innerHTML = legendTypes.map(k=>
  `<div class="legend-item"><span class="dot" style="background:${eventColorHex[k]}"></span>${k}</div>`
).join('');

// ============ 필터 칩 ============
const filterRow = document.getElementById('filterRow');
let activeTypes = new Set(Object.keys(eventColorHex));

function renderFilterChips(){
  const allChip = `<div class="filter-chip all active" data-all="1">전체</div>`;
  const chips = Object.keys(eventColorHex).map(k=>{
    const isActive = activeTypes.has(k);
    const style = isActive
      ? `background:${eventColorHex[k]};border-color:${eventColorHex[k]};`
      : '';
    return `<div class="filter-chip${isActive?' active':''}" data-type="${k}" style="${style}">
      <span class="dot" style="background:${isActive?'#fff':eventColorHex[k]}"></span>${k}
    </div>`;
  }).join('');
  filterRow.innerHTML = allChip + chips;
  syncAllChip();
}

function syncAllChip(){
  const allChip = filterRow.querySelector('.filter-chip.all');
  if(activeTypes.size === Object.keys(eventColorHex).length){
    allChip.classList.add('active');
  } else {
    allChip.classList.remove('active');
  }
}

filterRow.addEventListener('click', (e)=>{
  const chip = e.target.closest('.filter-chip');
  if(!chip) return;
  if(chip.dataset.all){
    activeTypes = new Set(Object.keys(eventColorHex));
  } else {
    const t = chip.dataset.type;
    if(activeTypes.has(t)) activeTypes.delete(t);
    else activeTypes.add(t);
    if(activeTypes.size===0) activeTypes = new Set(Object.keys(eventColorHex));
  }
  renderFilterChips();
  refreshCalendarEvents();
});

renderFilterChips();

// ============ 검색 ============
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', refreshCalendarEvents);

// ============ 모달 ============
const modal=document.getElementById('modal');
const memoViewModal = document.getElementById('memoViewModal');
const memoViewContent = document.getElementById('memoViewContent');

memoViewModal.querySelector('.close-btn').onclick = () => memoViewModal.classList.remove('show');
modal.querySelector('.close-btn').onclick = () => modal.classList.remove('show');

let selectedEvent=null;
let modifyMode=false;
let allEventsData=[];

const calendar=new FullCalendar.Calendar(document.getElementById('calendar'),{
  locale:'ko', firstDay:1, fixedWeekCount:false, height:'auto', dayMinHeight: window.innerWidth <= 600 ? 66 : 104,
  headerToolbar:{left:'title',right:'prev,next today customAddBtn modifyBtn'},
  customButtons:{
    customAddBtn:{text:'＋ 일정 추가',click(){
      selectedEvent=null;
      eventTitle.value='';
      eventDate.value='';
      eventLink.value='';
      eventType.value='';
      eventMemo.value='';
      deleteBtn.style.display='none';
      modal.classList.add('show');
    }},
    modifyBtn:{text:'수정',click(){
      modifyMode = !modifyMode;
      const btnEl = document.querySelector('.fc-modifyBtn-button');
      if(modifyMode){
        btnEl.textContent = '수정 모드 ON';
        btnEl.style.background = '#E8556B';
        btnEl.style.color = '#fff';
        btnEl.style.borderColor = '#E8556B';
      } else {
        btnEl.textContent = '수정';
        btnEl.style.background = '';
        btnEl.style.color = '';
        btnEl.style.borderColor = '';
      }
      calendar.render();
    }}
  },
  events:[],
  dayCellDidMount: arg => {
    const cell = arg.el;
    let pressTimer = null;
    const HOLD_MS = 350;

    const toISODate = d => {
      const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    };

    const resetCellStyle = () => {
      cell.style.transition = 'background-color .2s ease';
      cell.style.backgroundColor = '';
    };

    const startPress = e => {
      if (e.target.closest && e.target.closest('.fc-event')) return;
      cell.style.transition = `background-color ${HOLD_MS}ms linear`;
      cell.style.backgroundColor = 'var(--accent-soft)';
      pressTimer = setTimeout(()=>{
        pressTimer = null;
        resetCellStyle();
        selectedEvent=null;
        eventTitle.value='';
        eventDate.value=toISODate(arg.date);
        eventLink.value='';
        eventType.value='';
        eventMemo.value='';
        deleteBtn.style.display='none';
        modal.classList.add('show');
      }, HOLD_MS);
    };

    const cancelPress = () => {
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
      resetCellStyle();
    };

    cell.style.webkitUserSelect = 'none';
    cell.style.userSelect = 'none';
    cell.style.webkitTouchCallout = 'none';

    cell.addEventListener('mousedown', startPress);
    cell.addEventListener('mouseup', cancelPress);
    cell.addEventListener('mouseleave', cancelPress);
    cell.addEventListener('touchstart', startPress, {passive:true});
    cell.addEventListener('touchend', cancelPress);
    cell.addEventListener('touchcancel', cancelPress);
    cell.addEventListener('touchmove', cancelPress);
    cell.addEventListener('contextmenu', e => e.preventDefault());
  },
  eventContent: arg => {
    const type = arg.event.extendedProps.type;
    const link = arg.event.extendedProps.link;
    const memo = arg.event.extendedProps.memo;
    const hasMemo = memo && memo.trim();

    const bgColor = eventColorHex[type] || '#D9D5CE';
    let iconHTML = '';

    let memoIcon = '';
    if (type === '뮤지컬' && hasMemo) {
      memoIcon = '<i class="fa-solid fa-note-sticky event-icon"></i>';
    }

    iconHTML = getLinkIcon(link, 'event-icon');

    let len = arg.event.title.length;
    let fontSize, wrapStyle;
    if (window.innerWidth <= 600) {
      if (len <= 6) {
        fontSize = '4pt';
        wrapStyle = 'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';
      } else {
        fontSize = '3.6pt';
        wrapStyle = 'white-space:normal;overflow:visible;';
      }
    } else {
      fontSize = '8pt';
      wrapStyle = 'white-space:normal;overflow:visible;';
    }
    return {
      html: `<div title="${arg.event.title.replace(/"/g,'&quot;')}" style="display:flex;align-items:center;gap:2px;padding:2px 4px;background:${bgColor};color:#ffffff;border-radius:6px !important;font-size:${fontSize};font-weight:700;word-break:break-word;${wrapStyle}">
               ${iconHTML} ${memoIcon} ${arg.event.title}
             </div>`
    };
  }
});
calendar.render();

// ============ 이벤트 클릭 ============
calendar.on('eventClick', info => {
  const e = info.event;
  const { type, link, memo } = e.extendedProps;

  if (modifyMode) {
    selectedEvent = e;
    eventTitle.value = e.title;
    eventDate.value = e.startStr;
    eventLink.value = link || '';
    eventType.value = type || '';
    eventMemo.value = memo || '';
    deleteBtn.style.display='inline-block';
    modal.classList.add('show');
    return;
  }

  if (type === '뮤지컬' && !link && memo && memo.trim()) {
    memoViewContent.textContent = memo;
    memoViewModal.classList.add('show');
    return;
  }

  if (link) window.open(link, '_blank');
});

// ============ 필터 / 검색 반영 ============
function refreshCalendarEvents(){
  calendar.removeAllEvents();
  const q = searchInput.value.trim().toLowerCase();
  const filtered = allEventsData.filter(e=>
    activeTypes.has(e.type) && (!q || (e.title||'').toLowerCase().includes(q))
  );
  calendar.addEventSource(filtered);
  updateDday();
}

// ============ D-day 계산 ============
function updateDday(){
  const card = document.getElementById('ddayCard');
  const today = new Date(); today.setHours(0,0,0,0);

  const upcoming = allEventsData
    .filter(e=>e.start && activeTypes.has(e.type))
    .map(e=>({...e, dateObj:new Date(e.start)}))
    .filter(e=>!isNaN(e.dateObj) && e.dateObj>=today)
    .sort((a,b)=>a.dateObj-b.dateObj);

  if(upcoming.length===0){ card.style.display='none'; return; }

  const next = upcoming[0];
  const diffDays = Math.round((next.dateObj - today)/86400000);
  card.style.display='flex';
  document.getElementById('ddayNumber').textContent = diffDays===0 ? 'D-DAY' : `D-${diffDays}`;
  document.getElementById('ddayTitle').textContent = next.title;
  document.getElementById('ddayDate').textContent =
    `${next.dateObj.getMonth()+1}월 ${next.dateObj.getDate()}일`;
  document.getElementById('ddayDot').style.background = eventColorHex[next.type] || '#D9D5CE';
}

// ============ Firestore 데이터 로드 ============
async function loadCollection(name){
  const snap = await db.collection(name).get();
  return snap.docs.map(d=>({id:d.id, ...d.data()}));
}

// ============ Firestore 불러오기 ============
(async()=>{
  allEventsData = await loadCollection('schedules');
  refreshCalendarEvents();
})();

// ============ 저장 ============
saveBtn.onclick=async()=>{
  if(!eventTitle.value||!eventDate.value) return alert('제목과 날짜를 입력해주세요.');
  const data = {
    title: eventTitle.value,
    start: eventDate.value,
    link: eventLink.value,
    type: eventType.value,
    memo: eventMemo.value
  };

  if(selectedEvent){
    await db.collection('schedules').doc(selectedEvent.id).update(data);
    const idx = allEventsData.findIndex(e=>e.id===selectedEvent.id);
    if(idx>-1) allEventsData[idx] = {id:selectedEvent.id, ...data};
  } else {
    const r=await db.collection('schedules').add(data);
    allEventsData.push({id:r.id, ...data});
  }
  modal.classList.remove('show');
  modifyMode=false;
  const btnEl = document.querySelector('.fc-modifyBtn-button');
  if(btnEl){btnEl.textContent='수정';btnEl.style.background='';btnEl.style.color='';btnEl.style.borderColor='';}
  refreshCalendarEvents();
};

// ============ 삭제 ============
deleteBtn.onclick=async()=>{
  if(selectedEvent && confirm('정말 삭제하시겠습니까?')){
    await db.collection('schedules').doc(selectedEvent.id).delete();
    allEventsData = allEventsData.filter(e=>e.id!==selectedEvent.id);
    modal.classList.remove('show');
    modifyMode=false;
    const btnEl = document.querySelector('.fc-modifyBtn-button');
    if(btnEl){btnEl.textContent='수정';btnEl.style.background='';btnEl.style.color='';btnEl.style.borderColor='';}
    refreshCalendarEvents();
  }
};

// ============ 떡밥(Feed) 기능 ============
const feedCategories = ['직캠','직찍','꿀잼','기사','기타'];
const feedCategoryColor = { '직캠':'#3E8FD9', '직찍':'#F0578F', '꿀잼':'#F0A227', '기사':'#DB9A2E', '기타':'#9C9488' };
let feedData = [];
let feedByDate = {};
let selectedFeedDate = null;
let editingFeedId = null;

function rebuildFeedByDate(){
  feedByDate = {};
  feedData.forEach(item=>{
    if(!feedByDate[item.date]) feedByDate[item.date] = [];
    feedByDate[item.date].push(item);
  });
}

function toISODateFeed(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

const feedCatOptionsHTML = sel => feedCategories.map(c=>
  `<option value="${c}" ${c===sel?'selected':''}>${c}</option>`
).join('');

function feedItemHTML(item){
  const color = feedCategoryColor[item.category] || '#9C9488';

  if(item.id === editingFeedId){
    const linkVal = (item.link||'').replace(/"/g,'&quot;');
    const memoVal = item.memo||'';
    return `<div class="feed-item feed-item-editing" style="border-left-color:${color};">
      <select id="feedEditCat-${item.id}">${feedCatOptionsHTML(item.category)}</select>
      <input id="feedEditLink-${item.id}" placeholder="링크 (선택)" value="${linkVal}">
      <textarea id="feedEditMemo-${item.id}" placeholder="메모" rows="2">${memoVal}</textarea>
      <div class="feed-edit-actions">
        <button class="feed-cancel-btn" data-cancel="${item.id}">취소</button>
        <button class="feed-save-btn" data-save="${item.id}">저장</button>
      </div>
    </div>`;
  }

  const linkIcon = item.link ? getLinkIcon(item.link, 'feed-item-icon') : '';
  const memoHTML = item.memo ? `<div class="feed-item-memo">${item.memo.replace(/</g,'&lt;')}</div>` : '';
  const linkAttr = item.link ? ` data-link="${item.link.replace(/"/g,'&quot;')}"` : '';
  const clickableClass = item.link ? ' feed-item-clickable' : '';
  return `<div class="feed-item${clickableClass}" style="background:${hexToRgba(color,0.09)};border-left-color:${color};"${linkAttr}>
    <span class="dot" style="background:${color}"></span>
    <div class="feed-item-body">
      <div class="feed-item-cat">${linkIcon}${item.category}</div>
      ${memoHTML}
    </div>
    <div class="feed-item-actions">
      <i class="fa-solid fa-pen" data-edit="${item.id}"></i>
      <i class="fa-solid fa-trash" data-del="${item.id}"></i>
    </div>
  </div>`;
}

const feedPanel = document.getElementById('feedPanel');

function renderFeedPanel(dateStr){
  selectedFeedDate = dateStr;
  const d = new Date(dateStr+'T00:00:00');
  const items = (feedByDate[dateStr]||[]).slice().sort((a,b)=> (a.createdAt||0)-(b.createdAt||0));

  const itemsHTML = items.length ? items.map(feedItemHTML).join('') : `<div class="feed-empty">아직 등록된 떡밥이 없어요.</div>`;

  feedPanel.innerHTML = `
    <div class="feed-panel-date">${d.getMonth()+1}월 ${d.getDate()}일</div>
    <div class="feed-panel-sub">${items.length}개의 떡밥</div>
    ${itemsHTML}
    <div class="feed-add-form">
      <select id="feedNewCat">${feedCatOptionsHTML(feedCategories[0])}</select>
      <input id="feedNewLink" placeholder="링크 (선택)">
      <textarea id="feedNewMemo" placeholder="메모" rows="2"></textarea>
      <button class="feed-add-btn" id="feedAddBtn">+ 떡밥 추가</button>
    </div>
  `;

  feedPanel.querySelectorAll('.feed-item-clickable').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('.feed-item-actions')) return;
      const link = el.dataset.link;
      if(link) window.open(link, '_blank');
    });
  });

  feedPanel.querySelectorAll('[data-edit]').forEach(el=>{
    el.addEventListener('click', ()=>{
      editingFeedId = el.dataset.edit;
      renderFeedPanel(dateStr);
    });
  });

  feedPanel.querySelectorAll('[data-cancel]').forEach(el=>{
    el.addEventListener('click', ()=>{
      editingFeedId = null;
      renderFeedPanel(dateStr);
    });
  });

  feedPanel.querySelectorAll('[data-save]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.dataset.save;
      const category = document.getElementById(`feedEditCat-${id}`).value;
      const link = document.getElementById(`feedEditLink-${id}`).value.trim();
      const memo = document.getElementById(`feedEditMemo-${id}`).value.trim();
      if(!link && !memo) return alert('링크나 메모 중 하나는 입력해주세요.');
      await db.collection('feed').doc(id).update({ category, link, memo });
      const idx = feedData.findIndex(f=>f.id===id);
      if(idx>-1) feedData[idx] = { ...feedData[idx], category, link, memo };
      rebuildFeedByDate();
      editingFeedId = null;
      renderFeedPanel(dateStr);
      refreshFeedDots();
    });
  });

  feedPanel.querySelectorAll('[data-del]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!confirm('이 떡밥을 삭제할까요?')) return;
      const id = el.dataset.del;
      await db.collection('feed').doc(id).delete();
      feedData = feedData.filter(f=>f.id!==id);
      rebuildFeedByDate();
      if(editingFeedId === id) editingFeedId = null;
      renderFeedPanel(dateStr);
      refreshFeedDots();
    });
  });

  document.getElementById('feedAddBtn').onclick = async ()=>{
    const category = document.getElementById('feedNewCat').value;
    const link = document.getElementById('feedNewLink').value.trim();
    const memo = document.getElementById('feedNewMemo').value.trim();
    if(!link && !memo) return alert('링크나 메모 중 하나는 입력해주세요.');
    const data = { date: dateStr, category, link, memo, createdAt: Date.now() };
    const r = await db.collection('feed').add(data);
    feedData.push({id:r.id, ...data});
    rebuildFeedByDate();
    renderFeedPanel(dateStr);
    refreshFeedDots();
  };
}

document.getElementById('feedLegend').innerHTML = feedCategories.map(k=>
  `<div class="legend-item"><span class="dot" style="background:${feedCategoryColor[k]}"></span>${k}</div>`
).join('');

const feedCalendar = new FullCalendar.Calendar(document.getElementById('feedCalendar'), {
  locale:'ko', firstDay:1, fixedWeekCount:false, height:'auto',
  dayMinHeight: window.innerWidth <= 600 ? 50 : 90,
  headerToolbar:{left:'title', right:'prev,next today'},
  dayCellDidMount: arg => {
    const dateStr = toISODateFeed(arg.date);
    arg.el.addEventListener('click', ()=>{
      document.querySelectorAll('.fc-daygrid-day.feed-selected').forEach(el=>el.classList.remove('feed-selected'));
      arg.el.classList.add('feed-selected');
      editingFeedId = null;
      renderFeedPanel(dateStr);
    });
  },
  datesSet: ()=> refreshFeedDots()
});
window.feedCalendar = feedCalendar;

function refreshFeedDots(){
  document.querySelectorAll('#feedCalendar .fc-daygrid-day').forEach(cell=>{
    const dateStr = cell.getAttribute('data-date');
    if(!dateStr) return;
    cell.classList.remove('feed-has-entry');
    const oldDots = cell.querySelector('.feed-dots');
    if(oldDots) oldDots.remove();
    const items = feedByDate[dateStr];
    if(items && items.length){
      cell.classList.add('feed-has-entry');
      const dayTop = cell.querySelector('.fc-daygrid-day-top');
      const cats = [...new Set(items.map(i=>i.category))];
      const dotsWrap = document.createElement('div');
      dotsWrap.className = 'feed-dots';
      const dotsRow = document.createElement('div');
      dotsRow.className = 'feed-dots-row';
      cats.forEach(cat=>{
        const dot = document.createElement('span');
        dot.className = 'feed-dot';
        dot.style.background = feedCategoryColor[cat] || '#9C9488';
        dotsRow.appendChild(dot);
      });
      dotsWrap.appendChild(dotsRow);
      const countLabel = document.createElement('span');
      countLabel.className = 'feed-count';
      countLabel.textContent = `${items.length}개`;
      dotsWrap.appendChild(countLabel);
      if(dayTop) dayTop.insertAdjacentElement('afterend', dotsWrap);
      else (cell.querySelector('.fc-daygrid-day-frame') || cell).appendChild(dotsWrap);
    }
  });
}

feedCalendar.render();
refreshFeedDots();

(async()=>{
  feedData = await loadCollection('feed');
  rebuildFeedByDate();
  refreshFeedDots();
})();

// ============ 알쓸용잡(Wiki) 기능 ============
let wikiData = [];
let editingWikiId = null;
const wikiList = document.getElementById('wikiList');

function wikiItemHTML(item, num){
  if(item.id === editingWikiId){
    const val = (item.content||'').replace(/</g,'&lt;');
    return `<div class="wiki-item wiki-item-editing">
      <textarea id="wikiEditContent-${item.id}" rows="3">${val}</textarea>
      <div class="wiki-edit-actions">
        <button class="wiki-cancel-btn" data-wiki-cancel="${item.id}">취소</button>
        <button class="wiki-save-btn" data-wiki-save="${item.id}">저장</button>
      </div>
    </div>`;
  }
  const content = (item.content||'').replace(/</g,'&lt;');
  return `<div class="wiki-item">
    <div class="wiki-num">${num}</div>
    <div class="wiki-body">${content}</div>
    <div class="wiki-actions">
      <i class="fa-solid fa-pen" data-wiki-edit="${item.id}"></i>
      <i class="fa-solid fa-trash" data-wiki-del="${item.id}"></i>
    </div>
  </div>`;
}

function renderWikiList(){
  const items = wikiData.slice().sort((a,b)=> (a.createdAt||0)-(b.createdAt||0));
  wikiList.innerHTML = items.length
    ? items.map((item,i)=> wikiItemHTML(item, i+1)).join('')
    : `<div class="wiki-empty">아직 등록된 항목이 없어요.</div>`;

  wikiList.querySelectorAll('[data-wiki-edit]').forEach(el=>{
    el.addEventListener('click', ()=>{
      editingWikiId = el.dataset.wikiEdit;
      renderWikiList();
    });
  });

  wikiList.querySelectorAll('[data-wiki-cancel]').forEach(el=>{
    el.addEventListener('click', ()=>{
      editingWikiId = null;
      renderWikiList();
    });
  });

  wikiList.querySelectorAll('[data-wiki-save]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.dataset.wikiSave;
      const content = document.getElementById(`wikiEditContent-${id}`).value.trim();
      if(!content) return alert('내용을 입력해주세요.');
      await db.collection('wiki').doc(id).update({ content });
      const idx = wikiData.findIndex(w=>w.id===id);
      if(idx>-1) wikiData[idx] = { ...wikiData[idx], content };
      editingWikiId = null;
      renderWikiList();
    });
  });

  wikiList.querySelectorAll('[data-wiki-del]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!confirm('이 항목을 삭제할까요?')) return;
      const id = el.dataset.wikiDel;
      await db.collection('wiki').doc(id).delete();
      wikiData = wikiData.filter(w=>w.id!==id);
      if(editingWikiId === id) editingWikiId = null;
      renderWikiList();
    });
  });
}

document.getElementById('wikiAddBtn').onclick = async ()=>{
  const content = document.getElementById('wikiNewContent').value.trim();
  if(!content) return alert('내용을 입력해주세요.');
  const data = { content, createdAt: Date.now() };
  const r = await db.collection('wiki').add(data);
  wikiData.push({id:r.id, ...data});
  document.getElementById('wikiNewContent').value = '';
  renderWikiList();
};

(async()=>{
  wikiData = await loadCollection('wiki');
  renderWikiList();
})();

</script>
