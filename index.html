<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Solar Schedule</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* ============ 디자인 토큰 ============ */
:root{
  --page-bg:#EEEDF3;
  --surface:#FFFFFF;
  --ink:#221F1C;
  --ink-soft:#8B8580;
  --ink-faint:#C2BDB6;
  --line:#EAE7E1;
  --line-strong:#DEDAD2;

  --accent:#6C5CE7;
  --accent-soft:#EDEAFB;

  --danger:#E8556B;
  --danger-soft:#FCE3E7;

  --c-official:#F0554B;
  --c-musical:#DB9A2E;
  --c-broadcast:#3E8FD9;
  --c-sns:#8B7AE8;
  --c-solardo:#F0578F;
  --c-celebrate:#F08A3C;
  --c-release:#2FAE7C;
  --c-etc:#9C9488;

  --radius-xl:28px;
  --radius-lg:16px;
  --radius-md:12px;
  --radius-sm:9px;
  --shadow-card:0 24px 60px rgba(30,24,15,.08);
  --shadow-soft:0 4px 14px rgba(30,24,15,.05);
  --shadow-pop:0 16px 40px rgba(30,24,15,.18);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Pretendard Variable','Pretendard', system-ui, sans-serif;
  background:var(--page-bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

.page-outer{
  max-width:960px;
  margin:0 auto;
  padding:36px 18px 80px;
}

/* ============ 카드 ============ */
.app-card{
  background:var(--surface);
  border-radius:var(--radius-xl);
  box-shadow:var(--shadow-card);
  padding:30px 30px 22px;
}

/* ============ 헤더 ============ */
.app-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  margin-bottom:22px;
}
.wordmark{
  margin:0;
  font-weight:800;
  font-size:26px;
  letter-spacing:-0.02em;
  color:var(--ink);
}
.wordmark-thin{
  font-weight:500;
  color:var(--ink-soft);
}
.wordmark-caption{
  margin:4px 0 0;
  font-size:12.5px;
  color:var(--ink-faint);
  font-weight:600;
}

/* ============ D-day 스트립 ============ */
.dday-strip{
  display:flex;
  align-items:center;
  gap:14px;
  background:var(--accent-soft);
  border-radius:var(--radius-lg);
  padding:12px 18px;
  margin-bottom:18px;
}
.dday-number{
  font-weight:800;
  font-size:20px;
  color:var(--accent);
  min-width:52px;
}
.dday-divider{
  width:1px;
  align-self:stretch;
  background:rgba(108,92,231,.18);
}
.dday-body{display:flex;flex-direction:column;gap:2px;min-width:0;}
.dday-label{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;opacity:.75;}
.dday-title-row{display:flex;align-items:center;gap:7px;min-width:0;}
.dday-dot{width:6px;height:6px;border-radius:50%;flex:none;}
.dday-title{font-size:13.5px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dday-date{font-size:11.5px;color:var(--ink-soft);}

/* ============ 툴바 ============ */
.toolbar-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:18px;
}
.filter-row{
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
  flex:1;
  min-width:0;
}
.filter-row::-webkit-scrollbar{display:none;}
.filter-chip{
  flex:none;
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 14px;
  border-radius:999px;
  border:1px solid var(--line-strong);
  background:var(--surface);
  font-size:12.5px;
  font-weight:600;
  color:var(--ink-soft);
  cursor:pointer;
  user-select:none;
  transition:all .15s ease;
  white-space:nowrap;
}
.filter-chip .dot{width:6px;height:6px;border-radius:50%;flex:none;}
.filter-chip.active{color:#fff;border-color:transparent;}
.filter-chip.all{font-weight:700;}
.filter-chip.all.active{background:var(--ink);color:#fff;}

.search-box{
  position:relative;
  display:flex;
  align-items:center;
  flex:none;
  width:180px;
}
.search-box i{position:absolute;left:13px;font-size:12px;color:var(--ink-faint);}
.search-box input{
  width:100%;
  padding:9px 12px 9px 32px;
  border:1px solid var(--line-strong);
  border-radius:999px;
  background:var(--surface);
  font-family:inherit;
  font-size:12.5px;
  color:var(--ink);
}
.search-box input:focus{border-color:var(--accent);}
.search-box input::placeholder{color:var(--ink-faint);}

/* ============ 아바타 스택 (사진 버전용) ============ */
.avatar-stack{display:flex;align-items:center;flex:none;}
.avatar-stack img{
  width:34px;height:34px;border-radius:50%;
  object-fit:cover;
  border:2.5px solid var(--surface);
  box-shadow:0 2px 6px rgba(30,24,15,.12);
  margin-left:-10px;
}
.avatar-stack img:first-child{margin-left:0;}

/* ============ 달력 ============ */
.calendar-wrap{overflow-y:auto;-ms-overflow-style:none;scrollbar-width:none;}
.calendar-wrap::-webkit-scrollbar{width:0;background:transparent;}
#calendar{padding:0;}

.fc{font-family:'Pretendard Variable','Pretendard',system-ui,sans-serif;}
.fc-event{border:none!important;box-shadow:none!important;border-radius:6px!important;}
.fc .fc-toolbar-title{
  font-weight:800;
  font-size:16.5px;
  letter-spacing:-0.01em;
  color:var(--ink);
}
.fc .fc-button{
  font-family:inherit;
  font-size:11.5px;
  font-weight:700;
  padding:6px 12px;
  background:var(--surface);
  color:var(--ink);
  border:1px solid var(--line-strong);
  border-radius:999px;
}
.fc .fc-button:focus,.fc .fc-button:active{background:var(--surface);}
.fc .fc-button:hover{background:#F5F4F1;}
.fc .fc-customAddBtn-button{background:var(--ink)!important;color:#fff!important;border-color:var(--ink)!important;}
.fc .fc-customAddBtn-button:hover{filter:brightness(1.2);}
.fc .fc-modifyBtn-button{background:var(--surface)!important;color:var(--ink)!important;}
.fc .fc-today-button{color:var(--danger)!important;border-color:var(--danger-soft)!important;background:var(--danger-soft)!important;}
.fc-daygrid-day-number{font-size:10.5px;color:var(--ink-soft);font-weight:600;}
.fc-col-header-cell-cushion{
  font-size:10.5px;
  color:var(--ink-faint);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.06em;
  padding:8px 0;
}
.fc-theme-standard td, .fc-theme-standard th{border-color:var(--line)!important;}
.fc .fc-daygrid-day.fc-day-today{background:var(--accent-soft)!important;}
.fc-daygrid-day-frame{padding:2px;}
.fc-daygrid-day{cursor:pointer;}

*:focus{outline:none!important;box-shadow:none!important;}
.fc *:focus{outline:none!important;box-shadow:none!important;}

.event-icon{width:1em;height:1em;object-fit:contain;vertical-align:middle;margin-left:2px;}
.event-icon.bstage{width:calc(1em + 1pt);height:calc(1em + 1pt);}

/* ============ 모달 ============ */
.modal{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  background:var(--surface);
  padding:22px 22px 20px;
  border-radius:var(--radius-xl);
  width:340px;
  max-width:90%;
  max-height:82%;
  overflow-y:auto;
  display:none;
  z-index:9999;
  box-shadow:var(--shadow-pop);
}
.modal.show{display:block;}
.modal h3{
  font-weight:800;
  font-size:17px;
  letter-spacing:-0.01em;
  margin:0 0 16px;
  color:var(--ink);
}
.modal .close-btn{
  position:absolute;top:14px;right:14px;
  border:none;background:none;font-size:16px;cursor:pointer;color:var(--ink-faint);
}
.field-label{
  font-size:11px;
  font-weight:700;
  letter-spacing:.06em;
  color:var(--ink-faint);
  text-transform:uppercase;
  margin:12px 0 4px;
  display:block;
}
.modal input,.modal select,.modal textarea{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--line-strong);
  border-radius:var(--radius-sm);
  font-family:inherit;
  font-size:13px;
  color:var(--ink);
  background:var(--surface);
}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--accent);}
.modal textarea{resize:vertical;}

.modal-actions{display:flex;gap:8px;margin-top:20px;}
.btn{
  flex:1;
  padding:11px;
  border:none;
  border-radius:999px;
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}
.btn-primary{background:var(--ink);color:#fff;}
.btn-primary:hover{background:#3A362F;}
.btn-danger{background:var(--danger-soft);color:var(--danger);}
.btn-danger:hover{background:var(--danger);color:#fff;}

/* ============ 메모 보기 모달 ============ */
.memo-title{
  font-size:13px;
  font-weight:700;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--accent);
  text-transform:uppercase;
  letter-spacing:.08em;
}
#memoViewContent{font-size:13px;line-height:1.7;color:var(--ink);}

/* ============ 범례 ============ */
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:6px 12px;
  justify-content:center;
  margin:18px 0 0;
}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ink-soft);}
.legend-item .dot{width:7px;height:7px;border-radius:50%;flex:none;}

footer.site-footer{
  text-align:center;
  margin-top:22px;
  font-size:10px;
  letter-spacing:.14em;
  color:var(--ink-faint);
  text-transform:uppercase;
}

/* ============ 반응형 ============ */
@media(max-width:600px){
  .page-outer{padding:22px 10px 70px;}
  .app-card{padding:20px 16px 16px;border-radius:22px;}
  .wordmark{font-size:21px;}
  .dday-strip{padding:10px 14px;gap:10px;}
  .dday-number{font-size:17px;min-width:40px;}
  .toolbar-row{flex-direction:column;align-items:stretch;}
  .search-box{width:100%;}
  .fc-daygrid-day-number{font-size:9px!important;}
  .fc .fc-toolbar-title{font-size:14px;}
  .fc .fc-button{font-size:10px;padding:4px 9px;}
  .fc-col-header-cell-cushion{font-size:9px;}
  .avatar-stack img{width:28px;height:28px;}
  .modal input,.modal select,.modal textarea{font-size:16px;}
  .search-box input{font-size:16px;}
}
</style>
</head>
<body>
<div class="page-outer">
  <div class="app-card">

    <div class="app-header">
      <div>
        <h1 class="wordmark">Solar <span class="wordmark-thin">Schedule</span></h1>
        <p class="wordmark-caption">마마무 솔라 캘린더</p>
      </div>
    </div>

    <div id="ddayCard" class="dday-strip" style="display:none;">
      <div class="dday-number" id="ddayNumber">–</div>
      <div class="dday-divider"></div>
      <div class="dday-body">
        <div class="dday-label">다가오는 일정</div>
        <div class="dday-title-row">
          <span class="dday-dot" id="ddayDot"></span>
          <span class="dday-title" id="ddayTitle"></span>
        </div>
        <div class="dday-date" id="ddayDate"></div>
      </div>
    </div>

    <div class="toolbar-row">
      <div class="filter-row" id="filterRow"></div>
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="searchInput" placeholder="일정 검색">
      </div>
    </div>

    <div class="calendar-wrap">
      <div id="calendar"></div>
    </div>

  </div>

  <div class="legend" id="legend"></div>
  <footer class="site-footer">✨ DC Solar Gallery ✨</footer>
</div>

<div id="modal" class="modal">
  <button class="close-btn">&times;</button>
  <h3>일정 등록 / 수정</h3>

  <span class="field-label">제목</span>
  <input id="eventTitle" placeholder="일정 제목">

  <span class="field-label">날짜</span>
  <input id="eventDate" type="date">

  <span class="field-label">종류</span>
  <select id="eventType">
    <option value="">종류 선택</option>
    <option value="공식">공식</option>
    <option value="뮤지컬">뮤지컬</option>
    <option value="방송">방송</option>
    <option value="SNS">SNS</option>
    <option value="솔라시도">솔라시도</option>
    <option value="축하">축하</option>
    <option value="발매">발매</option>
    <option value="기타">기타</option>
  </select>

  <span class="field-label">링크 (선택)</span>
  <input id="eventLink" placeholder="https://...">

  <span class="field-label">메모</span>
  <textarea id="eventMemo" placeholder="메모" rows="3"></textarea>

  <div class="modal-actions">
    <button id="deleteBtn" class="btn btn-danger">삭제</button>
    <button id="saveBtn" class="btn btn-primary">저장</button>
  </div>
</div>

<div id="memoViewModal" class="modal">
  <button class="close-btn">&times;</button>
  <h3 class="memo-title"><i class="fa-regular fa-note-sticky"></i> Memo</h3>
  <p id="memoViewContent" style="white-space:pre-wrap;"></p>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyD7PwhcOZpYMEm4znPSkCTkKM2ZJzlmX0k",
  authDomain:"yong-schedule.firebaseapp.com",
  projectId:"yong-schedule"
});
const db = firebase.firestore();

// ============ 색상 정의 ============
const eventColorHex = {
  '공식':'#F0554B','뮤지컬':'#DB9A2E','축하':'#F08A3C','발매':'#2FAE7C',
  '방송':'#3E8FD9','SNS':'#8B7AE8','솔라시도':'#F0578F','기타':'#9C9488'
};

const legendTypes = Object.keys(eventColorHex).filter(k=>k!=='솔라시도');

document.getElementById('legend').innerHTML = legendTypes.map(k=>
  `<div class="legend-item"><span class="dot" style="background:${eventColorHex[k]}"></span>${k}</div>`
).join('');

// ============ 필터 칩 ============
const filterRow = document.getElementById('filterRow');
let activeTypes = new Set(Object.keys(eventColorHex));

function renderFilterChips(){
  const allChip = `<div class="filter-chip all active" data-all="1">전체</div>`;
  const chips = Object.keys(eventColorHex).map(k=>{
    const isActive = activeTypes.has(k);
    const style = isActive
      ? `background:${eventColorHex[k]};border-color:${eventColorHex[k]};`
      : '';
    return `<div class="filter-chip${isActive?' active':''}" data-type="${k}" style="${style}">
      <span class="dot" style="background:${isActive?'#fff':eventColorHex[k]}"></span>${k}
    </div>`;
  }).join('');
  filterRow.innerHTML = allChip + chips;
  syncAllChip();
}

function syncAllChip(){
  const allChip = filterRow.querySelector('.filter-chip.all');
  if(activeTypes.size === Object.keys(eventColorHex).length){
    allChip.classList.add('active');
  } else {
    allChip.classList.remove('active');
  }
}

filterRow.addEventListener('click', (e)=>{
  const chip = e.target.closest('.filter-chip');
  if(!chip) return;
  if(chip.dataset.all){
    activeTypes = new Set(Object.keys(eventColorHex));
  } else {
    const t = chip.dataset.type;
    if(activeTypes.has(t)) activeTypes.delete(t);
    else activeTypes.add(t);
    if(activeTypes.size===0) activeTypes = new Set(Object.keys(eventColorHex));
  }
  renderFilterChips();
  refreshCalendarEvents();
});

renderFilterChips();

// ============ 검색 ============
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', refreshCalendarEvents);

// ============ 모달 ============
const modal=document.getElementById('modal');
const memoViewModal = document.getElementById('memoViewModal');
const memoViewContent = document.getElementById('memoViewContent');

memoViewModal.querySelector('.close-btn').onclick = () => memoViewModal.classList.remove('show');
modal.querySelector('.close-btn').onclick = () => modal.classList.remove('show');

let selectedEvent=null;
let modifyMode=false;
let allEventsData=[];

const calendar=new FullCalendar.Calendar(document.getElementById('calendar'),{
  locale:'ko', firstDay:1, fixedWeekCount:false, height:'auto', dayMinHeight:104,
  headerToolbar:{left:'title',right:'prev,next today customAddBtn modifyBtn'},
  customButtons:{
    customAddBtn:{text:'＋ 일정 추가',click(){
      selectedEvent=null;
      eventTitle.value='';
      eventDate.value='';
      eventLink.value='';
      eventType.value='';
      eventMemo.value='';
      deleteBtn.style.display='none';
      modal.classList.add('show');
    }},
    modifyBtn:{text:'수정',click(){
      modifyMode = !modifyMode;
      const btnEl = document.querySelector('.fc-modifyBtn-button');
      if(modifyMode){
        btnEl.textContent = '수정 모드 ON';
        btnEl.style.background = '#E8556B';
        btnEl.style.color = '#fff';
        btnEl.style.borderColor = '#E8556B';
      } else {
        btnEl.textContent = '수정';
        btnEl.style.background = '';
        btnEl.style.color = '';
        btnEl.style.borderColor = '';
      }
      calendar.render();
    }}
  },
  events:[],
  dayCellDidMount: arg => {
    const cell = arg.el;
    let pressTimer = null;
    const HOLD_MS = 350;

    const toISODate = d => {
      const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    };

    const resetCellStyle = () => {
      cell.style.transition = 'background-color .2s ease';
      cell.style.backgroundColor = '';
    };

    const startPress = e => {
      if (e.target.closest && e.target.closest('.fc-event')) return;
      cell.style.transition = `background-color ${HOLD_MS}ms linear`;
      cell.style.backgroundColor = 'var(--accent-soft)';
      pressTimer = setTimeout(()=>{
        pressTimer = null;
        resetCellStyle();
        selectedEvent=null;
        eventTitle.value='';
        eventDate.value=toISODate(arg.date);
        eventLink.value='';
        eventType.value='';
        eventMemo.value='';
        deleteBtn.style.display='none';
        modal.classList.add('show');
      }, HOLD_MS);
    };

    const cancelPress = () => {
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
      resetCellStyle();
    };

    cell.style.webkitUserSelect = 'none';
    cell.style.userSelect = 'none';
    cell.style.webkitTouchCallout = 'none';

    cell.addEventListener('mousedown', startPress);
    cell.addEventListener('mouseup', cancelPress);
    cell.addEventListener('mouseleave', cancelPress);
    cell.addEventListener('touchstart', startPress, {passive:true});
    cell.addEventListener('touchend', cancelPress);
    cell.addEventListener('touchcancel', cancelPress);
    cell.addEventListener('touchmove', cancelPress);
    cell.addEventListener('contextmenu', e => e.preventDefault());
  },
  eventContent: arg => {
    const type = arg.event.extendedProps.type;
    const link = arg.event.extendedProps.link;
    const memo = arg.event.extendedProps.memo;
    const hasMemo = memo && memo.trim();

    const bgColor = eventColorHex[type] || '#D9D5CE';
    let iconHTML = '';

    let memoIcon = '';
    if (type === '뮤지컬' && hasMemo) {
      memoIcon = '<i class="fa-solid fa-note-sticky event-icon"></i>';
    }

    if(link){
      if(link.includes('instagram')) iconHTML = '<i class="fab fa-instagram event-icon"></i>';
      else if(link.includes('youtube.com') || link.includes('youtu.be')) iconHTML = '<i class="fab fa-youtube event-icon"></i>';
      else if(link.includes('facebook')) iconHTML = '<i class="fab fa-facebook event-icon"></i>';
      else if(link.includes('tiktok')) iconHTML = '<i class="fab fa-tiktok event-icon"></i>';
      else if(link.includes('threads')) iconHTML = '<i class="fab fa-threads event-icon"></i>';
      else if(link.includes('kakaotalk')) iconHTML = '<i class="fab fa-kakaotalk event-icon"></i>';
      else if(link.includes('naver')) iconHTML = '<i class="fab fa-naver event-icon"></i>';
      else if(link.includes('github')) iconHTML = '<i class="fab fa-github event-icon"></i>';
      else if (link.includes('twitter.com') || link.includes('x.com')) iconHTML = '<i class="fab fa-x-twitter event-icon"></i>';
      else if(link.includes('bstage') || link.includes('https://solarkeem.com'))
        iconHTML = '<img src="https://i.namu.wiki/i/-BYbNrH2E_lYZNZnTZ7oJu1CdynHFQs8OczMZ4Qd2Jm2oGAgWJPTjoOi6LTBZnWumb_KFv7GSJhtp9B69w1fXA.svg" class="event-icon bstage">';
      else iconHTML = '<i class="fas fa-link event-icon"></i>';
    }

    let fontSize = window.innerWidth <= 600 ? (arg.event.title.length>=6?'4pt':'5pt') : '8pt';
    return {
      html: `<div style="display:flex;align-items:center;gap:2px;padding:2px 5px;background:${bgColor};color:#ffffff;border-radius:6px !important;font-size:${fontSize};font-weight:700;word-break:break-word;white-space:normal;">
               ${iconHTML} ${memoIcon} ${arg.event.title}
             </div>`
    };
  }
});
calendar.render();

// ============ 이벤트 클릭 ============
calendar.on('eventClick', info => {
  const e = info.event;
  const { type, link, memo } = e.extendedProps;

  if (modifyMode) {
    selectedEvent = e;
    eventTitle.value = e.title;
    eventDate.value = e.startStr;
    eventLink.value = link || '';
    eventType.value = type || '';
    eventMemo.value = memo || '';
    deleteBtn.style.display='inline-block';
    modal.classList.add('show');
    return;
  }

  if (type === '뮤지컬' && !link && memo && memo.trim()) {
    memoViewContent.textContent = memo;
    memoViewModal.classList.add('show');
    return;
  }

  if (link) window.open(link, '_blank');
});

// ============ 필터 / 검색 반영 ============
function refreshCalendarEvents(){
  calendar.removeAllEvents();
  const q = searchInput.value.trim().toLowerCase();
  const filtered = allEventsData.filter(e=>
    activeTypes.has(e.type) && (!q || (e.title||'').toLowerCase().includes(q))
  );
  calendar.addEventSource(filtered);
  updateDday();
}

// ============ D-day 계산 ============
function updateDday(){
  const card = document.getElementById('ddayCard');
  const today = new Date(); today.setHours(0,0,0,0);

  const upcoming = allEventsData
    .filter(e=>e.start && activeTypes.has(e.type))
    .map(e=>({...e, dateObj:new Date(e.start)}))
    .filter(e=>!isNaN(e.dateObj) && e.dateObj>=today)
    .sort((a,b)=>a.dateObj-b.dateObj);

  if(upcoming.length===0){ card.style.display='none'; return; }

  const next = upcoming[0];
  const diffDays = Math.round((next.dateObj - today)/86400000);
  card.style.display='flex';
  document.getElementById('ddayNumber').textContent = diffDays===0 ? 'D-DAY' : `D-${diffDays}`;
  document.getElementById('ddayTitle').textContent = next.title;
  document.getElementById('ddayDate').textContent =
    `${next.dateObj.getMonth()+1}월 ${next.dateObj.getDate()}일`;
  document.getElementById('ddayDot').style.background = eventColorHex[next.type] || '#D9D5CE';
}

// ============ Firestore 불러오기 ============
(async()=>{
  const snap=await db.collection('schedules').get();
  allEventsData = snap.docs.map(d=>({id:d.id,...d.data()}));
  refreshCalendarEvents();
})();

// ============ 저장 ============
saveBtn.onclick=async()=>{
  if(!eventTitle.value||!eventDate.value) return alert('제목과 날짜를 입력해주세요.');
  const data = {
    title: eventTitle.value,
    start: eventDate.value,
    link: eventLink.value,
    type: eventType.value,
    memo: eventMemo.value
  };

  if(selectedEvent){
    await db.collection('schedules').doc(selectedEvent.id).update(data);
    const idx = allEventsData.findIndex(e=>e.id===selectedEvent.id);
    if(idx>-1) allEventsData[idx] = {id:selectedEvent.id, ...data};
  } else {
    const r=await db.collection('schedules').add(data);
    allEventsData.push({id:r.id, ...data});
  }
  modal.classList.remove('show');
  modifyMode=false;
  const btnEl = document.querySelector('.fc-modifyBtn-button');
  if(btnEl){btnEl.textContent='수정';btnEl.style.background='';btnEl.style.color='';btnEl.style.borderColor='';}
  refreshCalendarEvents();
};

// ============ 삭제 ============
deleteBtn.onclick=async()=>{
  if(selectedEvent && confirm('정말 삭제하시겠습니까?')){
    await db.collection('schedules').doc(selectedEvent.id).delete();
    allEventsData = allEventsData.filter(e=>e.id!==selectedEvent.id);
    modal.classList.remove('show');
    modifyMode=false;
    const btnEl = document.querySelector('.fc-modifyBtn-button');
    if(btnEl){btnEl.textContent='수정';btnEl.style.background='';btnEl.style.color='';btnEl.style.borderColor='';}
    refreshCalendarEvents();
  }
};
</script>
</body>
